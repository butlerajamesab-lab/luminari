services:
  - type: web
    name: luminari-lighthouse
    runtime: node
    plan: starter
    branch: main
    buildCommand: >-
      node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); if(p.pnpm&&p.pnpm.patchedDependencies){delete p.pnpm.patchedDependencies['wouter@3.7.1']; if(Object.keys(p.pnpm.patchedDependencies).length===0) delete p.pnpm.patchedDependencies;} fs.writeFileSync('package.json', JSON.stringify(p,null,2));" && npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm build
    startCommand: >-
      NODE_ENV=production node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_APP_ID
        value: luminari-lighthouse
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: VITE_GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: LIGHTHOUSE_SUPABASE_URL
        value: https://wepxlinwbjrkqdzkqpar.supabase.co
      - key: LIGHTHOUSE_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LIGHTHOUSE_DOCUMENT_STORAGE_BACKEND
        value: supabase
      - key: LIGHTHOUSE_DOCUMENT_STORAGE_BUCKET
        value: case-documents
