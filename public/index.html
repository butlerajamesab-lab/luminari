<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Esquire moved</title>
  </head>
  <body>
    <p>Opening the current Esquire workspace…</p>
    <script>
      (function () {
        var target = 'https://esquire.onrender.com' + window.location.pathname + window.location.search + window.location.hash;
        window.location.replace(target);
      }());
    </script>
    <noscript><a href="https://esquire.onrender.com">Open Esquire</a></noscript>
  </body>
</html>
