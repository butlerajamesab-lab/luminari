name: Patch Civic Genome assembly parameter types

on:
  push:
    branches:
      - fix/civic-genome-assembly-parameter-types

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/civic-genome-assembly-parameter-types
          fetch-depth: 0

      - name: Cast polymorphic JSON parameters explicitly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server/civic-genome-rosetta-assembly.ts")
          text = path.read_text()

          replacements = {
              "set rosetta_extraction_run_id = $2,": "set rosetta_extraction_run_id = $2::text,",
              "structural_dna_hash = $3,": "structural_dna_hash = $3::text,",
              "'engine_version', $4,": "'engine_version', $4::text,",
              "'rule_version', $5,": "'rule_version', $5::text,",
              "'source_document_id', $6,": "'source_document_id', $6::bigint,",
              "'extraction_run_id', $2,": "'extraction_run_id', $2::text,",
              "'input_hash', $7,": "'input_hash', $7::text,",
              "'output_hash', $3,": "'output_hash', $3::text,",
              "'verification_state', $8,": "'verification_state', $8::text,",
              "'trait_count', $10,": "'trait_count', $10::integer,",
              "'rosetta_engine_version', $12,": "'rosetta_engine_version', $12::text,",
              "'rosetta_rule_set_version', $13,": "'rosetta_rule_set_version', $13::text,",
              "'rosetta_rule_manifest_hash', $14,": "'rosetta_rule_manifest_hash', $14::text,",
              "'rosetta_configuration_hash', $15,": "'rosetta_configuration_hash', $15::text,",
              "'rosetta_source_content_hash', $16,": "'rosetta_source_content_hash', $16::text,",
              "'rosetta_output_content_hash', $17": "'rosetta_output_content_hash', $17::text",
          }

          for before, after in replacements.items():
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"expected one occurrence of {before!r}, found {count}")
              text = text.replace(before, after, 1)

          path.write_text(text)

          test_path = Path("server/civic-genome-rosetta-assembly-parameter-types.test.ts")
          test_path.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\ndescribe("Civic Genome Rosetta assembly SQL parameter types", () => {\n  it("casts every parameter passed through jsonb_build_object", () => {\n    const source = readFileSync("server/civic-genome-rosetta-assembly.ts", "utf8");\n    const start = source.indexOf("update public.civic_genome_bill");\n    const end = source.indexOf("where genome_bill_id = $1", start);\n    expect(start).toBeGreaterThanOrEqual(0);\n    expect(end).toBeGreaterThan(start);\n    const statement = source.slice(start, end);\n\n    for (const fragment of [\n      "rosetta_extraction_run_id = $2::text",\n      "structural_dna_hash = $3::text",\n      "'engine_version', $4::text",\n      "'rule_version', $5::text",\n      "'source_document_id', $6::bigint",\n      "'extraction_run_id', $2::text",\n      "'input_hash', $7::text",\n      "'output_hash', $3::text",\n      "'verification_state', $8::text",\n      "'coverage', $9::jsonb",\n      "'trait_count', $10::integer",\n      "'rosetta_source_receipt', $11::jsonb",\n      "'rosetta_engine_version', $12::text",\n      "'rosetta_rule_set_version', $13::text",\n      "'rosetta_rule_manifest_hash', $14::text",\n      "'rosetta_configuration_hash', $15::text",\n      "'rosetta_source_content_hash', $16::text",\n      "'rosetta_output_content_hash', $17::text",\n    ]) {\n      expect(statement).toContain(fragment);\n    }\n  });\n});\n''')

          Path(".github/workflows/patch-civic-genome-assembly-parameter-types.yml").unlink()
          PY

      - name: Commit the source-controlled repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Civic Genome assembly JSON parameter types"
          git push origin HEAD:fix/civic-genome-assembly-parameter-types
