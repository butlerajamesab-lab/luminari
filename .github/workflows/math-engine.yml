name: Math Engine Contract
on:
  push:
    branches: [math-engine-repair]
  pull_request:
    paths:
      - 'server/math/**'
      - 'server/routers/math-engine-router.ts'
      - 'server/ingestion/scheduler.ts'
      - 'supabase/migrations/*math_engine*'
      - 'tsconfig.math-engine.json'
      - '.github/workflows/math-engine.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run server/math --reporter=verbose
      - run: pnpm tsc -p tsconfig.math-engine.json --noEmit
      - run: pnpm run build
