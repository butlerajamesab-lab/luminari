name: Math Engine Contract
on:
  push:
    branches: [math-engine-repair]
  pull_request:
    paths:
      - 'server/math/**'
      - 'server/routers/math-engine-router.ts'
      - 'supabase/migrations/*math_engine*'
      - '.github/workflows/math-engine.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm vitest run server/math --reporter=verbose
      - run: pnpm tsc --noEmit --skipLibCheck
      - run: pnpm run build
