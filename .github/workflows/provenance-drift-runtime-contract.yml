name: Provenance Drift Runtime Contract

on:
  pull_request:
    paths:
      - "server/provenance-drift-runtime-compat.ts"
      - "server/provenance-drift-runtime-compat.contract.test.ts"
      - "server/db.ts"
      - ".github/workflows/provenance-drift-runtime-contract.yml"
  push:
    branches: [main]
    paths:
      - "server/provenance-drift-runtime-compat.ts"
      - "server/provenance-drift-runtime-compat.contract.test.ts"
      - "server/db.ts"
      - ".github/workflows/provenance-drift-runtime-contract.yml"

jobs:
  provenance-drift-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec vitest run server/provenance-drift-runtime-compat.contract.test.ts
      - run: pnpm run build
