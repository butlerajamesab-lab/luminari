name: Migration Inventory

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Write local Supabase migration versions
        shell: bash
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]+).*/\1/' \
            | grep -E '^[0-9]{8,14}$' \
            | sort -u > migration-versions.txt
          wc -l migration-versions.txt
      - name: Upload migration inventory
        uses: actions/upload-artifact@v4
        with:
          name: migration-versions
          path: migration-versions.txt
          if-no-files-found: error
