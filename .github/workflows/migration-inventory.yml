name: Migration Ledger Reconciliation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
      SUPABASE_DATABASE_URL_SECRET: ${{ secrets.SUPABASE_DATABASE_URL }}
      LIGHTHOUSE_DATABASE_URL_SECRET: ${{ secrets.LIGHTHOUSE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Restore exact missing migration files
        id: restore
        shell: bash
        run: |
          set -uo pipefail
          : > restore-error.log
          DATABASE_URL="${DATABASE_URL_SECRET:-${SUPABASE_DATABASE_URL_SECRET:-${LIGHTHOUSE_DATABASE_URL_SECRET:-}}}"
          if [ -z "$DATABASE_URL" ]; then
            echo "No supported database URL secret is configured." | tee restore-error.log >&2
            exit 2
          fi
          DATABASE_URL="${DATABASE_URL/aws-0-<region>.pooler.supabase.com/aws-1-us-west-2.pooler.supabase.com}"
          DATABASE_URL="${DATABASE_URL/postgres.<project-ref>/postgres.wepxlinwbjrkqdzkqpar}"
          DATABASE_URL="${DATABASE_URL/postgresql:\/\/postgres:/postgresql:\/\/postgres.wepxlinwbjrkqdzkqpar:}"
          DATABASE_URL="${DATABASE_URL/postgres:\/\/postgres:/postgres:\/\/postgres.wepxlinwbjrkqdzkqpar:}"

          versions=(
            20260529061843 20260605224132 20260605225538 20260605231514
            20260609093826 20260609122541 20260612180131 20260612180225
            20260613083723 20260613094359 20260613100249 20260614205300
            20260614213814 20260614213931 20260622063640 20260705144336
            20260713055919 20260713074738 20260713075935 20260713081607
            20260713081625 20260713082050 20260713083902 20260713084033
            20260713084401 20260713084626 20260713091637 20260713093123
            20260713095140 20260713102826 20260713105316 20260713172413
            20260713172504 20260714091011
          )
          quoted=$(printf "'%s'," "${versions[@]}")
          quoted="${quoted%,}"

          if ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -F $'\t' -c "
            select version,
                   regexp_replace(name, '[^a-zA-Z0-9_]+', '_', 'g'),
                   replace(encode(convert_to(statements[1], 'UTF8'), 'base64'), E'\\n', '')
              from supabase_migrations.schema_migrations
             where version in ($quoted)
             order by version
          " > /tmp/migrations.tsv 2> restore-error.log; then
            sed -E 's#(postgres(?:ql)?://)[^@]+@#\1***@#g' restore-error.log >&2
            exit 4
          fi

          restored=0
          while IFS=$'\t' read -r version name content_b64; do
            path="supabase/migrations/${version}_${name}.sql"
            printf '%s' "$content_b64" | base64 --decode > "$path"
            restored=$((restored + 1))
          done < /tmp/migrations.tsv

          if [ "$restored" -ne 34 ]; then
            echo "Expected 34 migrations, restored $restored" | tee restore-error.log >&2
            exit 3
          fi

          git add supabase/migrations
          if git diff --cached --quiet; then
            echo "All migration files already restored."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore 34 missing Supabase migration files"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Upload restore diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-restore-diagnostics
          path: restore-error.log
          if-no-files-found: warn
