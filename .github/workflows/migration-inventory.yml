name: Migration Ledger Reconciliation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Export exact missing migration files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restored-migrations
          versions="'20260529061843','20260605224132','20260605225538','20260605231514','20260609093826','20260609122541','20260612180131','20260612180225','20260613083723','20260613094359','20260613100249','20260614205300','20260614213814','20260614213931','20260622063640','20260705144336','20260713055919','20260713074738','20260713075935','20260713081607','20260713081625','20260713082050','20260713083902','20260713084033','20260713084401','20260713084626','20260713091637','20260713093123','20260713095140','20260713102826','20260713105316','20260713172413','20260713172504','20260714091011'"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -F $'\t' -c "select version, regexp_replace(name, '[^a-zA-Z0-9_]+', '_', 'g'), replace(replace(encode(convert_to(statements[1], 'UTF8'), 'base64'), E'\\n', ''), E'\\r', '') from supabase_migrations.schema_migrations where version in ($versions) order by version" > migrations.tsv
          test "$(wc -l < migrations.tsv)" -eq 34
          while IFS=$'\t' read -r version name content_b64; do
            printf '%s' "$content_b64" | base64 --decode > "restored-migrations/${version}_${name}.sql"
          done < migrations.tsv
          test "$(find restored-migrations -type f -name '*.sql' | wc -l)" -eq 34
      - name: Upload restored migrations
        uses: actions/upload-artifact@v4
        with:
          name: restored-migrations
          path: restored-migrations
          if-no-files-found: error
