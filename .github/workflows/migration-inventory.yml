name: Migration Ledger Reconciliation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
      - name: Restore exact missing migration files
        shell: bash
        run: |
          set -eEuo pipefail
          : > restore-error.log
          trap 'status=$?; echo "failure_line=${LINENO} status=${status}" >> restore-error.log; exit ${status}' ERR

          SUPABASE_URL="https://wepxlinwbjrkqdzkqpar.supabase.co"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndlcHhsaW53Ympya3FkemtxcGFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNzM0OTUsImV4cCI6MjA5MDc0OTQ5NX0.TDEswS4JskimfZjpN-Rrph2Y6WiDUEwEcJXWKhlEWZk"

          curl --fail-with-body --silent --show-error \
            "${SUPABASE_URL}/rest/v1/missing_migration_ledger_export_tmp?select=version,migration_name,content_b64&order=version.asc" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "apikey: ${ANON_KEY}" \
            > migrations.json 2> restore-error.log

          row_count=$(jq 'length' migrations.json)
          echo "row_count=${row_count}" >> restore-error.log
          if [ "$row_count" -ne 34 ]; then
            echo "Expected 34 migrations, received $row_count" | tee -a restore-error.log >&2
            exit 3
          fi

          jq -r '.[] | [.version, .migration_name, .content_b64] | @tsv' migrations.json > migrations.tsv
          cut -f1,2 migrations.tsv > migration-row-manifest.txt

          restored=0
          while IFS=$'\t' read -r version name content_b64; do
            safe_name=$(printf '%s' "$name" | sed -E 's/[^a-zA-Z0-9_]+/_/g')
            path="supabase/migrations/${version}_${safe_name}.sql"
            printf '%s' "$content_b64" | base64 --decode > "$path"
            restored=$((restored + 1))
          done < migrations.tsv

          if [ "$restored" -ne 34 ]; then
            echo "Expected 34 migrations, restored $restored" | tee -a restore-error.log >&2
            exit 4
          fi

          git add supabase/migrations
          if git diff --cached --quiet; then
            echo "All migration files already restored."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore 34 missing Supabase migration files"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Upload restore diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-restore-diagnostics
          path: |
            restore-error.log
            migration-row-manifest.txt
            migrations.json
          if-no-files-found: warn
