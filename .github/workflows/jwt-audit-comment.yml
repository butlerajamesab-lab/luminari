name: Redacted JWT audit report

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Produce redacted report
        id: audit
        shell: bash
        run: |
          set +e
          python3 scripts/audit-hardcoded-jwts.py > jwt-audit-report.txt 2>&1
          status=$?
          cat jwt-audit-report.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Post redacted findings
        if: steps.audit.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file jwt-audit-report.txt
