name: Finalize hard-coded JWT cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: finalize-hardcoded-jwt-cleanup
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/remove-render-secrets
          fetch-depth: 0
      - name: Apply bounded credential cleanup
        run: python3 scripts/finalize-hardcoded-jwt-cleanup.py
      - name: Commit direct cleanup and remove temporary machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f -- scripts/finalize-hardcoded-jwt-cleanup.py
          git rm -f -- .github/workflows/audit-hardcoded-jwts.yml
          git rm -f -- .github/workflows/jwt-audit-comment.yml
          git status --short
          git add -A
          git commit -m "Remove remaining hard-coded JWT credentials [jwt-cleanup-applied]"
          git push origin HEAD:security/remove-render-secrets
