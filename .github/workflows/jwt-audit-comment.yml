name: Finalize hard-coded JWT cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: finalize-hardcoded-jwt-cleanup
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/remove-render-secrets
          fetch-depth: 1
      - name: Apply bounded credential cleanup
        run: python3 scripts/finalize-hardcoded-jwt-cleanup.py
      - name: Commit direct credential cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add render.yaml scripts/audit-hardcoded-jwts.py .github/workflows/pr-test.yml server/routers.ts dist/index.js bundle-src/luminari-intake-v2.html
          git status --short
          git commit -m "Remove remaining hard-coded JWT credentials [jwt-cleanup-applied]"
          git push origin HEAD:security/remove-render-secrets
