name: Apply Docket detail cache fallback

on:
  push:
    branches: [fix/docket-detail-cache-404-fallback]
    paths: [.github/workflows/apply-docket-cache-fallback.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/docket-detail-cache-404-fallback
          fetch-depth: 0
      - name: Patch Docket detail cache fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/routes/docket.ts')
          text = path.read_text()

          old_read = '''const read_bill_detail_cache = async (bill_id: number): Promise<docket_bill_detail_cache_row | null> => {
  const response = await fetch(
    supabase_cache_url("docket_bill_detail_cache", {
      bill_id: `eq.${bill_id}`,
      select: "*",
    }),
    {
      method: "GET",
      headers: supabase_cache_headers(),
    },
  );

  return parse_supabase_cache_response<docket_bill_detail_cache_row>(response);
};'''
          new_read = '''const read_bill_detail_cache = async (bill_id: number): Promise<docket_bill_detail_cache_row | null> => {
  const response = await fetch(
    supabase_cache_url("docket_bill_detail_cache", {
      bill_id: `eq.${bill_id}`,
      select: "*",
    }),
    {
      method: "GET",
      headers: supabase_cache_headers(),
    },
  );

  if (response.status === 404) {
    return null;
  }

  return parse_supabase_cache_response<docket_bill_detail_cache_row>(response);
};'''

          old_upsert = '''const upsert_bill_detail_cache = async (row: docket_bill_detail_cache_row): Promise<void> => {
  const response = await fetch(
    supabase_cache_url("docket_bill_detail_cache", {
      on_conflict: "bill_id",
    }),
    {
      method: "POST",
      headers: supabase_cache_headers(true),
      body: JSON.stringify(row),
    },
  );

  if (!response.ok) {
    throw new Error(`supabase_cache_request_failed_http_${response.status}`);
  }
};'''
          new_upsert = '''const upsert_bill_detail_cache = async (row: docket_bill_detail_cache_row): Promise<boolean> => {
  const response = await fetch(
    supabase_cache_url("docket_bill_detail_cache", {
      on_conflict: "bill_id",
    }),
    {
      method: "POST",
      headers: supabase_cache_headers(true),
      body: JSON.stringify(row),
    },
  );

  if (response.status === 404) {
    return false;
  }

  if (!response.ok) {
    throw new Error(`supabase_cache_request_failed_http_${response.status}`);
  }

  return true;
};'''

          old_call = '''    await upsert_bill_detail_cache(row);

    return res.json({
      ok: true,
      source: cached ? "legiscan_refresh_stale_cache" : "legiscan_refresh_empty_cache",
      bill_id,
      fetched_at: row.fetched_at,
      bill,
    });'''
          new_call = '''    const cache_write_succeeded = await upsert_bill_detail_cache(row);

    return res.json({
      ok: true,
      source: cached
        ? "legiscan_refresh_stale_cache"
        : cache_write_succeeded
          ? "legiscan_refresh_empty_cache"
          : "legiscan_direct_cache_unavailable",
      bill_id,
      fetched_at: row.fetched_at,
      cache_write_succeeded,
      bill,
    });'''

          for old, new, label in [(old_read,new_read,'read'),(old_upsert,new_upsert,'upsert'),(old_call,new_call,'route')]:
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              text = text.replace(old,new,1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/docket.ts
          git commit -m "Allow Docket bill detail without cache table"
          git push origin HEAD:fix/docket-detail-cache-404-fallback
