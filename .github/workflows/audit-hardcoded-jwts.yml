name: Finalize hard-coded JWT cleanup

on:
  push:
    branches:
      - security/remove-render-secrets

permissions:
  contents: write

concurrency:
  group: finalize-hardcoded-jwt-cleanup
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[jwt-cleanup-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/remove-render-secrets
          fetch-depth: 0
      - name: Apply bounded credential cleanup
        run: python3 scripts/finalize-hardcoded-jwt-cleanup.py
      - name: Commit direct cleanup and remove temporary machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/finalize-hardcoded-jwt-cleanup.py
          git rm .github/workflows/audit-hardcoded-jwts.yml
          git rm .github/workflows/jwt-audit-comment.yml
          git add render.yaml scripts/audit-hardcoded-jwts.py .github/workflows/pr-test.yml server/routers.ts dist/index.js bundle-src/luminari-intake-v2.html
          git commit -m "Remove remaining hard-coded JWT credentials [jwt-cleanup-applied]"
          git push origin HEAD:security/remove-render-secrets
