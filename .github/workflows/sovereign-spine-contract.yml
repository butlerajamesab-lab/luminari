name: Sovereign Spine Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "server/engines/export-spine-engine.ts"
      - "server/engines/restore-spine-engine.ts"
      - "server/engines/sovereign-export-spine-engine.ts"
      - "server/engines/sovereign-export-spine-engine-v2.ts"
      - "server/engines/sovereign-export-spine-engine.test.ts"
      - "server/engines/sovereign-restore-spine-engine.ts"
      - "server/engines/sovereign-restore-spine-engine.test.ts"
      - "server/engines/spine-bundle-contract.ts"
      - "server/engines/spine-bundle-contract.test.ts"
      - "server/engines/spine-consistent-data-export.ts"
      - "server/engines/spine-consistent-data-export.test.ts"
      - "server/engines/spine-deployment-manifest.ts"
      - "server/engines/spine-export-snapshot.ts"
      - "server/engines/spine-export-snapshot.test.ts"
      - "server/engines/spine-postgres.ts"
      - "server/engines/spine-postgres.test.ts"
      - "server/engines/spine-registry-policy.ts"
      - "server/engines/spine-restore-preflight.ts"
      - "server/engines/spine-restore-preflight.test.ts"
      - "server/engines/spine-schema-export.ts"
      - "server/engines/spine-run-store.ts"
      - "server/engines/spine-run-store.test.ts"
      - "server/engines/spine-static-table-policy.ts"
      - "server/engines/spine-static-table-policy.test.ts"
      - "server/engines/spine-target-contract.ts"
      - "server/engines/spine-target-contract.test.ts"
      - "server/engines/sovereign-spine-source-contract.test.ts"
      - "supabase/migrations/20260727163000_sovereign_spine_run_substrate.sql"
      - ".github/workflows/sovereign-spine-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-spine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Portable export and restore contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spine
      SPINE_EXPORT_SIGNING_KEY: ci-sovereign-spine-signing-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create historical Spine ledger fixtures
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create table public.export_spine_runs (
            id serial primary key,
            export_type_esr text,
            bundle_name_esr text,
            status_esr text,
            created_at_esr bigint,
            completed_at_esr bigint,
            created_by_esr text,
            file_path_esr text,
            file_url_esr text,
            bundle_size_esr text,
            bundle_manifest_json_esr text,
            error_message_esr text
          );
          insert into public.export_spine_runs (id,export_type_esr,bundle_name_esr,status_esr)
          values (76,'full','historical-bundle','completed');
          select setval('public.export_spine_runs_id_seq',1,true);

          create type public.restore_spine_runs_restore_type_rsr_enum
            as enum ('full','schema','config','deployment');
          create type public.restore_spine_runs_status_rsr_enum
            as enum ('pending','validating','restoring','completed','failed','rolled_back');
          create type public.restore_spine_runs_risk_level_rsr_enum
            as enum ('low','medium','high','critical');

          create table public.restore_spine_runs (
            id serial primary key,
            bundle_name_rsr varchar(256) not null,
            restore_type_rsr public.restore_spine_runs_restore_type_rsr_enum not null,
            status_rsr public.restore_spine_runs_status_rsr_enum not null default 'pending',
            started_at_rsr bigint not null,
            completed_at_rsr bigint,
            restored_tables_rsr jsonb,
            restored_engines_rsr jsonb,
            restored_streams_rsr jsonb,
            errors_rsr jsonb,
            executed_by_rsr varchar(256),
            risk_level_rsr public.restore_spine_runs_risk_level_rsr_enum default 'medium',
            manifest_checksum_rsr varchar(128),
            validation_result_rsr jsonb
          );
          insert into public.restore_spine_runs (
            id,bundle_name_rsr,restore_type_rsr,status_rsr,started_at_rsr,
            restored_tables_rsr,executed_by_rsr,risk_level_rsr,validation_result_rsr
          ) values (
            9,'legacy-restore','config','completed',1,
            '["engine_registry"]'::jsonb,'legacy-operator','medium','{"checksumValid":true}'::jsonb
          );
          select setval('public.restore_spine_runs_id_seq',1,true);
          SQL

      - name: Apply Spine run substrate
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260727163000_sovereign_spine_run_substrate.sql

      - name: Verify run ledgers and legacy upgrade
        run: |
          test "$(psql "$DATABASE_URL" -Atc "select last_value from public.export_spine_runs_id_seq")" = "76"
          test "$(psql "$DATABASE_URL" -Atc "select last_value from public.restore_spine_runs_id_seq")" = "9"
          test "$(psql "$DATABASE_URL" -Atc "select data_type from information_schema.columns where table_schema='public' and table_name='restore_spine_runs' and column_name='status_rsr'")" = "text"
          test "$(psql "$DATABASE_URL" -Atc "select data_type from information_schema.columns where table_schema='public' and table_name='restore_spine_runs' and column_name='restored_tables_rsr'")" = "text"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='restore_spine_runs' and column_name in ('restored_rows_rsr','skipped_tables_rsr','summary_rsr')")" = "3"
          test "$(psql "$DATABASE_URL" -Atc "select status_rsr from public.restore_spine_runs where id=9")" = "completed"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "update public.restore_spine_runs set status_rsr='completed_with_errors', restored_rows_rsr=4, skipped_tables_rsr='[]', summary_rsr='legacy upgraded' where id=9"
          test "$(psql "$DATABASE_URL" -Atc "select status_rsr || ':' || restored_rows_rsr from public.restore_spine_runs where id=9")" = "completed_with_errors:4"

      - name: Run Spine contract tests
        shell: bash
        run: |
          set -o pipefail
          npx vitest run \
            server/engines/spine-bundle-contract.test.ts \
            server/engines/spine-consistent-data-export.test.ts \
            server/engines/spine-export-snapshot.test.ts \
            server/engines/spine-postgres.test.ts \
            server/engines/spine-restore-preflight.test.ts \
            server/engines/spine-run-store.test.ts \
            server/engines/spine-static-table-policy.test.ts \
            server/engines/spine-target-contract.test.ts \
            server/engines/sovereign-export-spine-engine.test.ts \
            server/engines/sovereign-restore-spine-engine.test.ts \
            server/engines/sovereign-spine-source-contract.test.ts \
            2>&1 | tee sovereign-spine-test.log

      - name: Upload Spine diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-spine-test-diagnostics
          path: sovereign-spine-test.log
