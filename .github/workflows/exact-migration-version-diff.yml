name: Exact Migration Version Diff

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pg
        run: npm install --no-save --legacy-peer-deps pg

      - name: Compare live ledger to local filenames
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { Client } = require('pg');

          async function main() {
            if (!process.env.DATABASE_URL) throw new Error('missing STAGING_DATABASE_URL');

            const migrationDir = path.join(process.cwd(), 'supabase', 'migrations');
            const files = fs.readdirSync(migrationDir)
              .filter((name) => name.endsWith('.sql'))
              .sort();

            const localRows = files.map((file) => {
              const match = file.match(/^(\d+)_/);
              return {
                file,
                version: match ? match[1] : null,
              };
            });

            const malformed = localRows.filter((row) => !row.version);
            const localByVersion = new Map();
            for (const row of localRows) {
              if (!row.version) continue;
              const bucket = localByVersion.get(row.version) || [];
              bucket.push(row.file);
              localByVersion.set(row.version, bucket);
            }

            const duplicates = [...localByVersion.entries()]
              .filter(([, versionFiles]) => versionFiles.length > 1)
              .map(([version, versionFiles]) => ({ version, files: versionFiles }));

            const client = new Client({
              connectionString: process.env.DATABASE_URL,
              ssl: { rejectUnauthorized: false },
            });
            await client.connect();
            const result = await client.query(
              'select version::text as version, name::text as name from supabase_migrations.schema_migrations order by version'
            );
            await client.end();

            const remote = result.rows;
            const remoteByVersion = new Map(remote.map((row) => [row.version, row]));

            const remoteOnly = remote
              .filter((row) => !localByVersion.has(row.version))
              .map((row) => ({ version: row.version, name: row.name }));

            const localOnly = [...localByVersion.entries()]
              .filter(([version]) => !remoteByVersion.has(version))
              .map(([version, versionFiles]) => ({ version, files: versionFiles }));

            const report = {
              generated_at: new Date().toISOString(),
              remote_count: remote.length,
              local_file_count: files.length,
              local_version_count: localByVersion.size,
              remote_only: remoteOnly,
              local_only: localOnly,
              duplicate_local_versions: duplicates,
              malformed_local_filenames: malformed,
            };

            fs.writeFileSync('migration-version-diff.json', JSON.stringify(report, null, 2) + '\n');
            fs.writeFileSync(
              'migration-version-diff.txt',
              [
                `remote_count=${report.remote_count}`,
                `local_file_count=${report.local_file_count}`,
                `local_version_count=${report.local_version_count}`,
                '',
                'REMOTE_ONLY',
                ...remoteOnly.map((row) => `${row.version}\t${row.name}`),
                '',
                'LOCAL_ONLY',
                ...localOnly.map((row) => `${row.version}\t${row.files.join(',')}`),
                '',
                'DUPLICATE_LOCAL_VERSIONS',
                ...duplicates.map((row) => `${row.version}\t${row.files.join(',')}`),
                '',
                'MALFORMED_LOCAL_FILENAMES',
                ...malformed.map((row) => row.file),
                '',
              ].join('\n')
            );

            console.log(JSON.stringify(report, null, 2));
            if (remoteOnly.length > 0 || duplicates.length > 0 || malformed.length > 0) {
              process.exitCode = 2;
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload migration diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-migration-version-diff
          path: |
            migration-version-diff.json
            migration-version-diff.txt
          if-no-files-found: warn
