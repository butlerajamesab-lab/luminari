name: Rosetta bounded truth validation

on:
  pull_request:
    paths:
      - "rosetta-candidates/20260824-v2513/**"
      - "rosetta-candidates/20260901-global-replay-truth/**"
      - "artifacts/lighthouse-audit/2026-08-25-kimi-spec-review/**"
      - ".github/workflows/rosetta-truth-validation.yml"
  push:
    branches:
      - main
    paths:
      - "rosetta-candidates/20260824-v2513/**"
      - "rosetta-candidates/20260901-global-replay-truth/**"
      - "artifacts/lighthouse-audit/2026-08-25-kimi-spec-review/**"
      - ".github/workflows/rosetta-truth-validation.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Rosetta candidate integrity and worker contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rosetta-candidates/20260824-v2513
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify packet hashes and static contracts
        run: |
          sha256sum -c SHA256SUMS
          python3 tests/static_checks.py

      - name: Verify truth-first worker behavior
        run: >-
          python3 -m unittest discover -s tests
          -p 'test_replay_manifest_worker.py' -v

      - name: Verify control fidelity and deterministic generation
        run: |
          python3 tools/check_control_fidelity.py
          python3 tools/generate.py
          git diff --exit-code -- .

  runtime-postgresql17:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rosetta_v2513_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rosetta_v2513_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: rosetta-candidates/20260824-v2513
    env:
      ROSETTA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rosetta_v2513_ci
      ROSETTA_DISPOSABLE_ACK: I_UNDERSTAND
      ROSETTA_CURRENT_VALIDATION_OUTPUT: /tmp/rosetta-v2513-current-runtime-validation.txt
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Require isolated PostgreSQL 17
        run: |
          test "$(psql "$ROSETTA_TEST_DATABASE_URL" -XAtqc \
            "select current_setting('server_version_num')::int / 10000")" = "17"

      - name: Run disposable v2.5.13 PostgreSQL runtime gate
        run: python3 tests/capture_evidence.py

      - name: Preserve current-build runtime transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosetta-v2513-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/rosetta-v2513-current-runtime-validation.txt
          if-no-files-found: error
          retention-days: 30

  global-replay-truth-static-only:
    name: Global replay-truth packet - static checks only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rosetta-candidates/20260901-global-replay-truth
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run source-contract checks (no PostgreSQL runtime claim)
        run: python3 tests/static_checks.py

  verify-lighthouse-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: artifacts/lighthouse-audit/2026-08-25-kimi-spec-review
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify source bytes and internal evidence
        run: python3 verify_packet.py
