name: Finalize Sovereign Continuity Query Results

on:
  push:
    branches:
      - fix/sovereign-continuity-core

permissions:
  contents: write

concurrency:
  group: finalize-sovereign-continuity-query-results
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout continuity branch
        uses: actions/checkout@v4
        with:
          ref: fix/sovereign-continuity-core
          fetch-depth: 0

      - name: Apply final PostgreSQL query-result reconciliation
        run: python3 scripts/finalize-sovereign-continuity-query-results.py

      - name: Validate query-result contract
        run: |
          grep -q 'const rows = Array.isArray((result as any).rows)' server/engines/admin-sovereign-control.ts
          grep -q 'const affectedRows = Number((result as any).rowCount' server/engines/executor-service.ts
          ! grep -q 'result\[0\] as unknown as any\[\]' server/engines/admin-sovereign-control.ts
          ! grep -q 'affectedRows = (result\[0\]' server/engines/executor-service.ts

      - name: Remove bounded staging machinery
        run: |
          git rm scripts/finalize-sovereign-continuity-query-results.py
          git rm .github/workflows/finalize-sovereign-continuity-query-results.yml

      - name: Commit final reconciliation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Finish Sovereign Continuity PostgreSQL query results [continuity-query-results]'
          git push origin HEAD:fix/sovereign-continuity-core
