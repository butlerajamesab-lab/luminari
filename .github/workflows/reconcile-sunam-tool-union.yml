name: Reconcile Sunam tool union

on:
  push:
    branches:
      - fix/sunam-operator-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-sunam-tool-union
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/sunam-operator-runtime
          fetch-depth: 0

      - name: Apply additive tool union
        run: python3 scripts/reconcile-sunam-tool-union.py

      - name: Validate additive contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          executor = Path('server/engines/sunam-executor.ts').read_text()
          test = Path('server/engines/sunam-operator-source-contract.test.ts').read_text()
          required = [
              'export const SUNAM_OPERATOR_TOOLS = [',
              'export const SUNAM_TOOLS = [',
              '...SUNAM_OPERATOR_TOOLS',
              '...SUNAM_SERVICE_ONLY_TOOLS.filter',
              '!SUNAM_OPERATOR_TOOL_NAMES.has(tool.function.name)',
              'tools: SUNAM_TOOLS',
          ]
          missing = [item for item in required if item not in executor]
          if 'preserves operational and case-service capabilities' not in test:
              missing.append('additive source contract test')
          if missing:
              raise SystemExit('missing additive tool-union contract: ' + ', '.join(missing))
          print('Sunam additive tool union validated')
          PY

      - name: Remove bounded staging machinery
        run: |
          git rm scripts/reconcile-sunam-tool-union.py
          git rm .github/workflows/reconcile-sunam-tool-union.yml

      - name: Commit durable union
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Preserve Sunam operator and service tools [sunam-tool-union-reconciled]'
          git push origin HEAD:fix/sunam-operator-runtime
