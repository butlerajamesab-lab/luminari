name: Apply California Rosetta source fix

on:
  push:
    branches:
      - fix/california-official-bill-text-source
    paths:
      - .github/workflows/apply-california-rosetta-source-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/california-official-bill-text-source
          fetch-depth: 0

      - name: Apply bounded source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('server/civic-genome-rosetta-extraction.ts')
          source = source_path.read_text()

          marker = '''function derive_wa_official_html_url(pdf_url: string): string | null {
            if (!pdf_url.includes("lawfilesext.leg.wa.gov/")) return null;
            if (!/\\/Pdf\\//i.test(pdf_url) || !/\\.pdf$/i.test(pdf_url)) return null;
            return pdf_url.replace(/\\/Pdf\\//i, "/Htm/").replace(/\\.pdf$/i, ".htm");
          }
          '''
          addition = marker + '''
          /**
           * California's state_link uses a client-side JSF billText route whose
           * fragment is not sent to the server. The official billNav route is the
           * server-rendered text surface for the same bill identity.
           */
          export function derive_california_official_text_url(source_url: string): string | null {
            let parsed: URL;
            try {
              parsed = new URL(source_url);
            } catch {
              return null;
            }
            if (parsed.hostname.toLowerCase() !== "leginfo.legislature.ca.gov") return null;
            if (!/\\/faces\\/billTextClient\\.xhtml$/i.test(parsed.pathname)) return null;
            const bill_id = parsed.searchParams.get("bill_id")?.trim();
            if (!bill_id) return null;
            const canonical = new URL("https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml");
            canonical.searchParams.set("bill_id", bill_id);
            return canonical.toString();
          }
          '''
          if marker not in source:
            raise SystemExit('derive_wa marker not found')
          source = source.replace(marker, addition, 1)

          old = '''  const source_url = String(document.state_link ?? "").trim();
            const doc_id = String(document.doc_id ?? "").trim();
            const document_type = String(document.type ?? "official").trim() || "official";
            if (!source_url || !doc_id) throw new Error("docket_document_identity_incomplete");

            const official = await fetch_bytes(source_url);
          '''
          new = '''  const selected_source_url = String(document.state_link ?? "").trim();
            const doc_id = String(document.doc_id ?? "").trim();
            const document_type = String(document.type ?? "official").trim() || "official";
            if (!selected_source_url || !doc_id) throw new Error("docket_document_identity_incomplete");

            const source_url = derive_california_official_text_url(selected_source_url)
              ?? selected_source_url;
            const official = await fetch_bytes(source_url);
          '''
          if old not in source:
            raise SystemExit('extract_source source block not found')
          source = source.replace(old, new, 1)

          old_meta = '''      docket_source_url: source_url,
                docket_source_content_type: official.content_type,
          '''
          new_meta = '''      docket_source_url: source_url,
                provider_state_link: selected_source_url,
                source_url_rewritten: source_url !== selected_source_url,
                docket_source_content_type: official.content_type,
          '''
          if old_meta not in source:
            raise SystemExit('source metadata marker not found')
          source = source.replace(old_meta, new_meta, 1)
          source_path.write_text(source)

          Path('server/civic-genome-rosetta-california-source.test.ts').write_text('''import { describe, expect, it } from "vitest";\n\nimport { derive_california_official_text_url } from "./civic-genome-rosetta-extraction";\n\ndescribe("California official legislative text URL", () => {\n  it("maps the exact AB635 JSF wrapper to the official server-rendered bill route", () => {\n    expect(derive_california_official_text_url(\n      "https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB635#97AMD",\n    )).toBe(\n      "https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202520260AB635",\n    );\n  });\n\n  it("does not rewrite other jurisdictions or incomplete California identities", () => {\n    expect(derive_california_official_text_url(\n      "https://lawfilesext.leg.wa.gov/biennium/2025-26/Htm/Bills/Session%20Laws/House/1701-S2.SL.htm",\n    )).toBeNull();\n    expect(derive_california_official_text_url(\n      "https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml",\n    )).toBeNull();\n  });\n});\n''')

          Path('.github/workflows/apply-california-rosetta-source-fix.yml').unlink()
          PY

      - name: Commit bounded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/civic-genome-rosetta-extraction.ts \
                  server/civic-genome-rosetta-california-source.test.ts \
                  .github/workflows/apply-california-rosetta-source-fix.yml
          git commit -m "Use California official server-rendered bill text"
          git push origin HEAD:fix/california-official-bill-text-source
