name: Reconcile Sunam bulk launch

on:
  push:
    branches:
      - fix/sunam-operator-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-sunam-bulk-launch
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/sunam-operator-runtime
          fetch-depth: 0

      - name: Apply background-launch reconciliation
        run: python3 scripts/reconcile-sunam-bulk-launch.py

      - name: Validate bounded launch contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          executor = Path('server/engines/sunam-executor.ts').read_text()
          test = Path('server/engines/sunam-operator-source-contract.test.ts').read_text()
          required = [
              'launch_sunam_background_ingestion',
              'completion_source: "ingest_runs"',
              'status: "started"',
              'const launches = streams.map',
              'const launches = stream_ids.map',
          ]
          missing = [item for item in required if item not in executor]
          if 'launches bulk stream work without holding' not in test:
              missing.append('bulk-launch source contract test')
          if missing:
              raise SystemExit('missing bounded launch contract: ' + ', '.join(missing))
          print('Sunam bounded background launch validated')
          PY

      - name: Remove bounded staging machinery
        run: |
          git rm scripts/reconcile-sunam-bulk-launch.py
          git rm .github/workflows/reconcile-sunam-bulk-launch.yml

      - name: Commit durable bulk launch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Start Sunam bulk ingestion without blocking requests [sunam-bulk-launch-reconciled]'
          git push origin HEAD:fix/sunam-operator-runtime
