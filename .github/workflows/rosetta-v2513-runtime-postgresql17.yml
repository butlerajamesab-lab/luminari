name: Rosetta 2.5.13 PostgreSQL 17 runtime

on:
  pull_request:
    paths:
      - "rosetta-candidates/20260824-v2513/**"
      - ".github/workflows/rosetta-v2513-runtime-postgresql17.yml"
  push:
    branches:
      - main
    paths:
      - "rosetta-candidates/20260824-v2513/**"
      - ".github/workflows/rosetta-v2513-runtime-postgresql17.yml"

permissions:
  contents: read

jobs:
  runtime-postgresql17:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rosetta_v2513_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rosetta_v2513_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: rosetta-candidates/20260824-v2513
    env:
      ROSETTA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rosetta_v2513_ci
      ROSETTA_DISPOSABLE_ACK: I_UNDERSTAND
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Require isolated PostgreSQL 17
        run: |
          test "$(psql "$ROSETTA_TEST_DATABASE_URL" -XAtqc \
            "select current_setting('server_version_num')::int / 10000")" = "17"

      - name: Run disposable Rosetta runtime gate
        run: |
          set -o pipefail
          python3 tests/run_all.py | tee "$RUNNER_TEMP/rosetta-v2513-runtime.txt"
