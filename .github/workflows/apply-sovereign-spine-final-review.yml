name: Apply Sovereign Spine Final Review

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - "scripts/apply-sovereign-spine-final-review.py"
      - "scripts/.sovereign-spine-final-review-trigger"
      - ".github/workflows/apply-sovereign-spine-final-review.yml"

permissions:
  contents: write

concurrency:
  group: apply-sovereign-spine-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply bounded review corrections
        run: python scripts/apply-sovereign-spine-final-review.py

      - name: Validate durable result
        run: |
          grep -q 'preflight_spine_restore_contents' server/engines/sovereign-restore-spine-engine.ts
          grep -q 'mutable name fallback is not permitted' server/engines/sovereign-restore-spine-engine.ts
          ! grep -q 'preflight_spine_restore_request(bundle, restoreType);' server/engines/sovereign-restore-spine-engine.ts

      - name: Remove staging machinery
        run: |
          rm -f scripts/apply-sovereign-spine-final-review.py
          rm -f scripts/.sovereign-spine-final-review-trigger
          rm -f .github/workflows/apply-sovereign-spine-final-review.yml

      - name: Commit durable corrections
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply final Sovereign Spine review corrections"
          git push origin HEAD:${{ github.head_ref }}
