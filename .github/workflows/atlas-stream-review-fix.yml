name: Atlas Stream Review Fix

on:
  push:
    branches:
      - fix/atlas-stream-recovery
    paths:
      - scripts/apply-atlas-stream-review-fixes.mjs
      - .github/workflows/atlas-stream-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/atlas-stream-recovery
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Apply deterministic review fixes
        run: node scripts/apply-atlas-stream-review-fixes.mjs

      - name: Run focused Atlas contracts
        run: >-
          npx vitest run
          server/ingestion/__tests__/atlas-stream-bridge-contract.test.ts
          server/ingestion/__tests__/atlas-stream-partial-progress-contract.test.ts
          server/ingestion/__tests__/atlas-stream-registry-recovery-contract.test.ts
          server/ingestion/__tests__/atlas-stream-schema-contract.test.ts

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit repaired implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Atlas stream recovery review fixes"
          git push origin HEAD:fix/atlas-stream-recovery
