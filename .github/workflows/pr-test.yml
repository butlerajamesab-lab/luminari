name: PR Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and health check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SCHEMA_GUARD_DB_URL: postgresql://postgres:postgres@localhost:5432/app
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit Render secret configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path("render.yaml").read_text().splitlines()
          secret_keys = {
              "DATABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY",
              "JWT_SECRET",
              "GITHUB_OAUTH_CLIENT_SECRET",
              "LIGHTHOUSE_SUPABASE_SERVICE_ROLE_KEY",
          }

          blocks = {}
          current_block = None
          for line in lines:
              match = re.match(r"\s*- key: ([A-Z0-9_]+)\s*$", line)
              if match:
                  key = match.group(1)
                  current_block = []
                  blocks.setdefault(key, []).append(current_block)
              elif current_block is not None:
                  current_block.append(line.strip())

          failures = []
          for key in sorted(secret_keys):
              key_blocks = blocks.get(key, [])
              if not key_blocks:
                  failures.append(f"missing deployment secret declaration: {key}")
                  continue
              for index, block in enumerate(key_blocks, start=1):
                  if any(item.startswith("value:") for item in block):
                      failures.append(
                          f"hard-coded deployment secret value: {key} occurrence {index}"
                      )
                  if "sync: false" not in block:
                      failures.append(
                          f"deployment secret is not externally managed: {key} occurrence {index}"
                      )

          text = "\n".join(lines)
          if re.search(r"eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+", text):
              failures.append("JWT-shaped credential found in render.yaml")

          if failures:
              for failure in failures:
                  print(failure)
              raise SystemExit(1)

          print(f"Verified {len(secret_keys)} externally managed deployment secret families")
          PY

      - name: Reject hard-coded JWT credentials
        run: python3 scripts/audit-hardcoded-jwts.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Drizzle schema generation
        run: pnpm exec drizzle-kit generate --dialect=postgresql --schema=./drizzle/schema.ts --out="$(mktemp -d)" --name=ci_schema_probe

      - name: Execute authenticated multipart upload acceptance
        run: pnpm exec vitest run server/upload-route-multipart-acceptance.test.ts

      - name: Verify web/background runtime isolation
        run: >-
          pnpm exec vitest run
          server/runtime-role.test.ts
          server/runtime-role-boundary.contract.test.ts
          server/executor-runtime-boundary.test.ts

      - name: Full repository test suite
        run: pnpm exec vitest run

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify exact production migration ledger
        run: python3 scripts/audit-supabase-migration-ledger-parity.py

      - name: Bootstrap schema guard fixtures
        run: psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/verification/runtime_hotfix_schema_guard_fixture.sql

      - name: Bootstrap Supabase database roles
        run: |
          psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin bypassrls;
            end if;
          end
          $$;
          SQL

      - name: Apply clean-branch lineage foundation
        run: psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260501203517_fresh_branch_signal_severity_foundation.sql

      - name: Apply conditional historical RLS hardening
        run: psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260509001402_phase1_rls_hardening_lighthouse_retry.sql

      - name: Apply analysis snapshot lineage and hardening
        run: |
          psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260513200122_add_analysis_snapshots_table.sql
          psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260513200123_harden_analysis_snapshots_fresh_replay.sql
          psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260513200136_add_assertion_atoms_compatibility_view.sql
          psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260513200250_fix_governing_authorities_compatibility_view.sql

      - name: Verify clean-branch lineage contract
        run: |
          psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            missing_relations text[];
            rls_defects text[];
          begin
            select array_agg(required_relation order by required_relation)
              into missing_relations
            from unnest(array[
              'entry_runs',
              'snapshots',
              'pipeline_runs',
              'export_runs',
              'analysis_snapshots'
            ]) required_relation
            where to_regclass(format('public.%I', required_relation)) is null;

            if missing_relations is not null then
              raise exception 'missing lineage relations: %', missing_relations;
            end if;

            select array_agg(c.relname order by c.relname)
              into rls_defects
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
              and c.relname = any(array[
                'entry_runs',
                'snapshots',
                'pipeline_runs',
                'export_runs',
                'analysis_snapshots'
              ])
              and not c.relrowsecurity;

            if rls_defects is not null then
              raise exception 'lineage relations without RLS: %', rls_defects;
            end if;

            if (
              select count(*)
              from pg_constraint
              where contype = 'f'
                and conrelid = any(array[
                  'public.snapshots'::regclass,
                  'public.pipeline_runs'::regclass,
                  'public.export_runs'::regclass,
                  'public.analysis_snapshots'::regclass
                ])
            ) <> 6 then
              raise exception 'lineage foreign-key count mismatch';
            end if;

            if has_table_privilege('anon', 'public.analysis_snapshots', 'select')
               or has_table_privilege('anon', 'public.analysis_snapshots', 'insert')
               or has_table_privilege('authenticated', 'public.analysis_snapshots', 'insert') then
              raise exception 'analysis_snapshots client grant boundary is not fail-closed';
            end if;
          end
          $$;
          SQL

      - name: Apply namespace migration
        run: psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260511000001_operational_core_namespace_activation.sql

      - name: Apply archived runtime hotfix source
        run: psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migration_sources/legacy_unversioned/20260528_runtime_hotfix_sync.sql

      - name: Verify runtime hotfix schema contract
        run: psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/verification/runtime_hotfix_verification.sql

      - name: Audit SQL/Supabase snake_case runtime boundaries
        run: node scripts/audit-runtime-camelcase.mjs

      - name: Check owned snake_case contracts
        run: pnpm run check:contracts

      - name: TypeScript check
        run: pnpm exec tsc -p tsconfig.ci.json --noEmit --pretty false

      - name: Vite client build
        run: pnpm exec vite build

      - name: Server bundle build
        run: |
          set +e
          pnpm exec esbuild server/_core/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist --log-level=debug --log-limit=200 > esbuild.log 2>&1
          code=$?
          echo "esbuild exit code: $code"
          echo "--- esbuild diagnostics ---"
          cat esbuild.log
          exit $code

      - name: Upload esbuild diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esbuild-diagnostics
          path: esbuild.log

      - name: Copy server config
        run: '[ ! -d server/config ] || cp -r server/config dist/config'

      - name: Start server
        run: |
          npm start &
          echo $! > server.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server ready after ${i}x2s"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start within 60s"
          exit 1

      - name: Run health check
        run: curl -fsS http://localhost:3000/api/health
