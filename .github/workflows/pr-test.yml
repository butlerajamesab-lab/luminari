name: PR Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and health check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SCHEMA_GUARD_DB_URL: postgresql://postgres:postgres@localhost:5432/app
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/recovered-migration-placeholder-syntax
          fetch-depth: 0

      - name: Repair recovered migration placeholders
        shell: bash
        run: |
          python3 scripts/repair-recovered-placeholder-syntax.py
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/pr-test.yml
          git rm scripts/repair-recovered-placeholder-syntax.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations .github/workflows/pr-test.yml
          git commit -m "Repair recovered migration placeholder syntax"
          git push origin HEAD:fix/recovered-migration-placeholder-syntax

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap schema guard fixtures
        run: psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/verification/runtime_hotfix_schema_guard_fixture.sql

      - name: Apply namespace migration
        run: psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260511000001_operational_core_namespace_activation.sql

      - name: Apply runtime hotfix migration
        run: psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260528_runtime_hotfix_sync.sql

      - name: Verify runtime hotfix schema contract
        run: psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/verification/runtime_hotfix_verification.sql

      - name: Audit SQL/Supabase snake_case runtime boundaries
        run: node scripts/audit-runtime-camelcase.mjs

      - name: Check owned snake_case contracts
        run: npm run check:contracts

      - name: TypeScript legacy debt scan
        continue-on-error: true
        run: npx tsc -p tsconfig.ci.json --noEmit --pretty false

      - name: Vite client build
        run: npx vite build

      - name: Server bundle build
        run: |
          set +e
          npx esbuild server/_core/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist --log-level=debug --log-limit=200 > esbuild.log 2>&1
          code=$?
          echo "esbuild exit code: $code"
          echo "--- esbuild diagnostics ---"
          cat esbuild.log
          exit $code

      - name: Upload esbuild diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esbuild-diagnostics
          path: esbuild.log

      - name: Copy server config
        run: '[ ! -d server/config ] || cp -r server/config dist/config'

      - name: Start server
        run: |
          npm start &
          echo $! > server.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server ready after ${i}x2s"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start within 60s"
          exit 1

      - name: Run health check
        run: curl -fsS http://localhost:3000/api/health
