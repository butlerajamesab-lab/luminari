name: PR Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch_rosetta_link:
    name: Apply bounded Rosetta link patch
    if: github.head_ref == 'fix/civic-genome-rosetta-standalone-ledger-url'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch existing Civic Genome surface
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("client/src/pages/CivicGenome.tsx")
          text = path.read_text(encoding="utf-8")

          if "external_url: string | null" not in text:
              type_before = "  display_name: string;\n  role: string;"
              type_after = "  display_name: string;\n  external_url: string | null;\n  role: string;"
              if text.count(type_before) != 1:
                  raise SystemExit("unexpected operating_contract type shape")
              text = text.replace(type_before, type_after, 1)

          start = text.index("const explicit_empty_contracts")
          end = text.index("const returned_keys", start)
          fallback = text[start:end]
          if fallback.count("external_url: null") == 0:
              pattern = re.compile(
                  r'(?P<prefix>\s+service_key: "(?:atlas|prism|viewfinder|kaleidoscope)",\n'
                  r'\s+display_name: "[^"]+",\n)'
                  r'(?P<indent>\s+)role:'
              )
              fallback, count = pattern.subn(
                  lambda match: match.group("prefix") + match.group("indent")
                  + "external_url: null,\n" + match.group("indent") + "role:",
                  fallback,
              )
              if count != 4:
                  raise SystemExit(f"expected four fallback contracts, patched {count}")
              text = text[:start] + fallback + text[end:]
          elif fallback.count("external_url: null") != 4:
              raise SystemExit("partial fallback external_url state")

          if "href={contract.external_url}" not in text:
              detail = '                  <div style={{ fontSize: 13, lineHeight: 1.5, color: "#c8d5ea" }}>{contract.detail}</div>\n'
              if text.count(detail) != 1:
                  raise SystemExit("unexpected operating-contract detail shape")
              link = detail + '''                  {contract.external_url && (
                    <a
                      href={contract.external_url}
                      target="_blank"
                      rel="noopener noreferrer"
                      style={{
                        alignSelf: "flex-start",
                        color: "#7dd3fc",
                        fontSize: 12,
                        fontWeight: 700,
                        textDecoration: "underline",
                        textUnderlineOffset: 3,
                      }}
                    >
                      Open {contract.display_name} service
                    </a>
                  )}
'''
              text = text.replace(detail, link, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit only the UI correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/CivicGenome.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Civic Genome link already patched"
            exit 0
          fi
          git commit -m "Render Rosetta operating contract as external link"
          git push origin "HEAD:${{ github.head_ref }}"

  test:
    name: Build and health check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SCHEMA_GUARD_DB_URL: postgresql://postgres:postgres@localhost:5432/app
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Render secret configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path("render.yaml").read_text().splitlines()
          secret_keys = {
              "DATABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY",
              "JWT_SECRET",
              "GITHUB_OAUTH_CLIENT_SECRET",
              "LIGHTHOUSE_SUPABASE_SERVICE_ROLE_KEY",
          }

          blocks = {}
          current_block = None
          for line in lines:
              match = re.match(r"\s*- key: ([A-Z0-9_]+)\s*$", line)
              if match:
                  key = match.group(1)
                  current_block = []
                  blocks.setdefault(key, []).append(current_block)
              elif current_block is not None:
                  current_block.append(line.strip())

          failures = []
          for key in sorted(secret_keys):
              key_blocks = blocks.get(key, [])
              if not key_blocks:
                  failures.append(f"missing deployment secret declaration: {key}")
                  continue
              for index, block in enumerate(key_blocks, start=1):
                  if any(item.startswith("value:") for item in block):
                      failures.append(
                          f"hard-coded deployment secret value: {key} occurrence {index}"
                      )
                  if "sync: false" not in block:
                      failures.append(
                          f"deployment secret is not externally managed: {key} occurrence {index}"
                      )

          text = "\n".join(lines)
          if re.search(r"eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+", text):
              failures.append("JWT-shaped credential found in render.yaml")

          if failures:
              for failure in failures:
                  print(failure)
              raise SystemExit(1)

          print(f"Verified {len(secret_keys)} externally managed deployment secret families")
          PY

      - name: Reject hard-coded JWT credentials
        run: python3 scripts/audit-hardcoded-jwts.py

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify recovered migration placeholders
        shell: bash
        run: |
          count=0
          while IFS= read -r file; do
            psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f "$file"
            count=$((count + 1))
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*_recovered_placeholder.sql' | sort)
          if [ "$count" -eq 0 ]; then
            echo "No recovered placeholder migrations were found"
            exit 1
          fi
          echo "Verified $count recovered placeholder migrations"

      - name: Verify unique migration versions
        shell: bash
        run: |
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path

          by_version = defaultdict(list)
          for path in sorted(Path("supabase/migrations").glob("*.sql")):
              version = path.name.split("_", 1)[0]
              if len(version) == 14 and version.isdigit():
                  by_version[version].append(path.name)

          duplicates = {
              version: names
              for version, names in by_version.items()
              if len(names) > 1
          }
          if duplicates:
              for version, names in sorted(duplicates.items()):
                  print(f"duplicate migration version {version}: {', '.join(names)}")
              raise SystemExit(1)

          print(f"Verified {len(by_version)} unique 14-digit migration versions")
          PY

      - name: Bootstrap schema guard fixtures
        run: psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/verification/runtime_hotfix_schema_guard_fixture.sql

      - name: Apply namespace migration
        run: psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260511000001_operational_core_namespace_activation.sql

      - name: Apply archived runtime hotfix source
        run: psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migration_sources/legacy_unversioned/20260528_runtime_hotfix_sync.sql

      - name: Verify runtime hotfix schema contract
        run: psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/verification/runtime_hotfix_verification.sql

      - name: Audit SQL/Supabase snake_case runtime boundaries
        run: node scripts/audit-runtime-camelcase.mjs

      - name: Check owned snake_case contracts
        run: npm run check:contracts

      - name: TypeScript legacy debt scan
        continue-on-error: true
        run: npx tsc -p tsconfig.ci.json --noEmit --pretty false

      - name: Vite client build
        run: npx vite build

      - name: Server bundle build
        run: |
          set +e
          npx esbuild server/_core/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist --log-level=debug --log-limit=200 > esbuild.log 2>&1
          code=$?
          echo "esbuild exit code: $code"
          echo "--- esbuild diagnostics ---"
          cat esbuild.log
          exit $code

      - name: Upload esbuild diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esbuild-diagnostics
          path: esbuild.log

      - name: Copy server config
        run: '[ ! -d server/config ] || cp -r server/config dist/config'

      - name: Start server
        run: |
          npm start &
          echo $! > server.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server ready after ${i}x2s"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start within 60s"
          exit 1

      - name: Run health check
        run: curl -fsS http://localhost:3000/api/health
