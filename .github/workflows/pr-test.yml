name: PR Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & health check (Supabase staging)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SCHEMA_GUARD_DB_URL: postgresql://postgres:postgres@localhost:5432/app

      NODE_ENV: test
      # Supabase staging project: wepxlinwbjrkqdzkqpar
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm' intentionally omitted — no package-lock.json in repo

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply targeted runtime migrations to fresh DB
        run: |
          set -euo pipefail
          # Pinned subset on purpose: avoids Supabase-managed objects in unrelated migrations
          for f in \
            supabase/migrations/20260511_operational_core_namespace_activation.sql \
            supabase/migrations/20260511_operational_core_runtime_views.sql \
            supabase/migrations/20260528_runtime_hotfix_sync.sql
          do
            echo "Applying $f"
            psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verify runtime hotfix schema contract
        run: psql "$SCHEMA_GUARD_DB_URL" -v ON_ERROR_STOP=1 -f supabase/verification/runtime_hotfix_verification.sql

      - name: Lint public runtime schema identifiers (camelCase guard)
        run: node scripts/check-public-runtime-camelcase.mjs

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm start &
          echo $! > server.pid
          # Wait for server to be ready (max 60s)
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/trpc/health > /dev/null 2>&1; then
              echo "Server ready after ${i}x2s"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start within 60s"
          exit 1

      - name: Run /api/trpc/health check
        run: |
          response=$(curl -fsS -w "\n%{http_code}" http://localhost:3000/api/trpc/health)
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "Health check failed with status $status"
            exit 1
          fi

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi
