name: Reconcile Sunam operator runtime

on:
  push:
    branches:
      - fix/sunam-operator-runtime
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-sunam-operator-runtime
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: fix/sunam-operator-runtime
          fetch-depth: 0

      - name: Apply bounded reconciliation
        run: python3 scripts/reconcile-sunam-operator-runtime.py

      - name: Validate durable contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          context = Path('server/engines/system-copilot-sunam.ts').read_text()
          executor = Path('server/engines/sunam-executor.ts').read_text()
          router = Path('server/routers/session76-router.ts').read_text()
          ui = Path('client/src/pages/SovereignControl.tsx').read_text()

          required = {
              'postgres context': 'query_with_diagnostics<{ tablename: string }>' in context,
              'postgres rows': 'table_result.rows' in context,
              'direct routing': 'resolve_direct_sunam_instruction(instruction)' in executor,
              'canonical LLM tools': 'tools: SUNAM_TOOLS' in executor,
              'canonical dispatch': 'SUNAM_TOOL_NAMES.has(toolName)' in executor,
              'admin execute': 'execute: adminProcedure' in router,
              'admin tool list': 'getTools: adminProcedure' in router,
              'admin dispatch': 'dispatchTool: adminProcedure' in router,
              'truthful UI authority': 'Sunam has governed authority over streams, engines, scheduler, diagnostics, configuration, and UI.' in ui,
          }
          forbidden = {
              'MySQL tuple context': 'tableResult[0]' in context,
              'restricted registry import': 'SUNAM_SERVICE_ONLY_TOOLS' in executor,
              'restricted registry path': 'sunam-service-only-tools' in executor,
              'false UI SQL claim': 'Sunam has full authority over streams, engines, SQL, migrations, config, and UI.' in ui,
          }

          failures = [name for name, passed in required.items() if not passed]
          failures += [name for name, present in forbidden.items() if present]
          if failures:
              raise SystemExit('contract validation failed: ' + ', '.join(failures))

          print('Sunam durable contract validated')
          PY

      - name: Remove bounded staging machinery
        run: |
          git rm scripts/reconcile-sunam-operator-runtime.py
          git rm .github/workflows/reconcile-sunam-operator-runtime.yml

      - name: Commit reconciled runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Reconcile Sunam PostgreSQL and operator contracts [sunam-runtime-reconciled]'
          git push origin HEAD:fix/sunam-operator-runtime
