name: Reconcile Sunam operator runtime

on:
  push:
    branches:
      - fix/sunam-operator-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-sunam-operator-runtime
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: fix/sunam-operator-runtime
          fetch-depth: 0

      - name: Apply bounded reconciliation
        run: python3 scripts/reconcile-sunam-operator-runtime.py

      - name: Validate durable diff
        shell: bash
        run: |
          git diff --check
          grep -q 'query_with_diagnostics<{ tablename: string }>' server/engines/system-copilot-sunam.ts
          grep -q 'resolve_direct_sunam_instruction(instruction)' server/engines/sunam-executor.ts
          grep -q 'tools: SUNAM_TOOLS' server/engines/sunam-executor.ts
          grep -q 'execute: adminProcedure' server/routers/session76-router.ts
          ! grep -q 'SUNAM_SERVICE_ONLY_TOOLS' server/engines/sunam-executor.ts
          ! grep -q 'tableResult\[0\]' server/engines/system-copilot-sunam.ts

      - name: Remove bounded staging machinery
        run: |
          git rm scripts/reconcile-sunam-operator-runtime.py
          git rm .github/workflows/reconcile-sunam-operator-runtime.yml

      - name: Commit reconciled runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Reconcile Sunam PostgreSQL and operator contracts [sunam-runtime-reconciled]'
          git push origin HEAD:fix/sunam-operator-runtime
