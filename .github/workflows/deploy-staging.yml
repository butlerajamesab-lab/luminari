name: CI — Build check (main)

# Honest CI for Luminari Lighthouse.
#
# Why this is build-only and not a deploy workflow:
#   Production deploys to Manus (luminari-7zyn9wud.manus.space) are performed
#   via Manus's internal `webdev_deploy_project` tool — there is no public
#   Manus deploy API. The previous workflow attempted to POST to a placeholder
#   `https://api.manus.space/v1/projects/...` endpoint that does not exist;
#   it appeared to succeed because Manus serves an HTML brochure page at
#   unknown URLs (returning 200 even for invalid project IDs), and then the
#   post-deploy health check failed against an empty STAGING_URL secret,
#   triggering the auto-rollback path on every push.
#
# What this workflow does instead:
#   - Confirms every commit on main installs and builds cleanly.
#   - Does NOT attempt to deploy.
#   - Does NOT run a health check against any URL.
#   - Does NOT fire auto-rollback (nothing to roll back from CI).
#
# Production deploys remain a manual step via the Manus interface.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  build:
    name: Install + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: production
      # Supabase staging project: wepxlinwbjrkqdzkqpar
      # Build-time env so any client bundle that needs these doesn't crash;
      # safe to leave unset — they're only required at runtime in Manus.
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm' intentionally omitted — no package-lock.json in repo

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Build summary
        if: always()
        run: |
          echo "## CI summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Note:** This workflow does not deploy. Production deploys" >> "$GITHUB_STEP_SUMMARY"
          echo "to Manus are performed manually via Manus's internal tooling." >> "$GITHUB_STEP_SUMMARY"
