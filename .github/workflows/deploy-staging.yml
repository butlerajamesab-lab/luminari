name: Deploy to Staging (Manus)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to manus.space + verify health
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MANUS_API_TOKEN: ${{ secrets.MANUS_API_TOKEN }}
      MANUS_PROJECT_ID: ${{ secrets.MANUS_PROJECT_ID }}
      STAGING_URL: ${{ secrets.STAGING_URL }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need previous commit for rollback

      - name: Capture previous commit (for rollback)
        id: prev
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm' intentionally omitted — no package-lock.json in repo

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      # ---- Manus deploy ----
      # Adjust the deploy step below to match your actual Manus workflow.
      # Common patterns: a Manus CLI, a curl to their deploy API, or rsync.
      - name: Deploy to Manus
        id: deploy
        run: |
          set -e
          echo "Deploying commit ${GITHUB_SHA} to Manus project ${MANUS_PROJECT_ID}"
          # Example using a hypothetical Manus deploy API:
          curl -fsS -X POST "https://api.manus.space/v1/projects/${MANUS_PROJECT_ID}/deploys" \
            -H "Authorization: Bearer ${MANUS_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"commit\":\"${GITHUB_SHA}\",\"environment\":\"staging\"}"

      - name: Wait for deploy to propagate
        run: sleep 20

      - name: Post-deploy /api/trpc/health check
        id: health
        run: |
          set +e
          for i in {1..10}; do
            response=$(curl -fsS -w "\n%{http_code}" "${STAGING_URL}/api/trpc/health")
            status=$(echo "$response" | tail -n 1)
            body=$(echo "$response" | head -n -1)
            echo "Attempt $i — status: $status"
            if [ "$status" = "200" ]; then
              echo "Health OK"
              echo "body=$body"
              exit 0
            fi
            sleep 6
          done
          echo "Health check failed after 10 attempts"
          exit 1

      # ---- Auto-rollback on failed health check ----
      - name: Rollback to previous commit
        if: failure() && steps.health.outcome == 'failure'
        run: |
          echo "Rolling back staging to ${{ steps.prev.outputs.sha }}"
          curl -fsS -X POST "https://api.manus.space/v1/projects/${MANUS_PROJECT_ID}/deploys" \
            -H "Authorization: Bearer ${MANUS_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"commit\":\"${{ steps.prev.outputs.sha }}\",\"environment\":\"staging\",\"rollback\":true}"

      - name: Verify rollback health
        if: failure() && steps.health.outcome == 'failure'
        run: |
          sleep 20
          for i in {1..10}; do
            status=$(curl -fsS -o /dev/null -w "%{http_code}" "${STAGING_URL}/api/trpc/health" || echo "000")
            echo "Rollback health attempt $i — status: $status"
            if [ "$status" = "200" ]; then
              echo "Rollback healthy"
              exit 0
            fi
            sleep 6
          done
          echo "WARNING: rollback also failed health check — manual intervention needed"
          exit 1
