name: CI — Build check (main)

# Build-only CI for Luminari Lighthouse. The linked Render service owns the
# production deployment lifecycle; this workflow verifies that each main
# commit installs from the committed lockfile and builds successfully.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  build:
    name: Install + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Note: do NOT set NODE_ENV=production here — package managers skip
      # devDependencies under that env, and Vite lives in devDependencies.
      NODE_ENV: development
      # Supabase staging project: wepxlinwbjrkqdzkqpar
      # Build-time env so any client bundle that needs these doesn't crash;
      # safe to leave unset — they're only required at runtime in Render.
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Build summary
        if: always()
        run: |
          echo "## CI summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Note:** This workflow verifies the build only. The linked" >> "$GITHUB_STEP_SUMMARY"
          echo "Render service owns the production deployment lifecycle." >> "$GITHUB_STEP_SUMMARY"
