name: Apply California official PDF session integration

on:
  push:
    branches:
      - fix/california-official-pdf-session
    paths:
      - .github/workflows/apply-california-official-pdf-session.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-california-official-pdf-session.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/california-official-pdf-session
          fetch-depth: 0

      - name: Apply bounded integration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/civic-genome-rosetta-extraction.ts')
          source = path.read_text()

          import_marker = 'import { create_rosetta_supabase_headers } from "./rosetta-supabase-auth";\n'
          import_addition = import_marker + '''import {
            derive_california_official_text_url,
            fetch_california_official_pdf,
          } from "./california-legislative-source";
          '''
          if import_marker not in source:
            raise SystemExit('import marker not found')
          source = source.replace(import_marker, import_addition, 1)

          constant_marker = 'const PDF_EXTRACTOR_VERSION = `pdf-parse-${PDF_PARSE_VERSION}-getText-v1`;\n'
          constant_addition = constant_marker + 'const CA_PDF_EXTRACTOR_VERSION = `ca-official-bill-pdf-v1+${PDF_EXTRACTOR_VERSION}`;\n'
          if constant_marker not in source:
            raise SystemExit('constant marker not found')
          source = source.replace(constant_marker, constant_addition, 1)

          local_function = '''/**
           * California's state_link uses a client-side JSF billText route whose
           * fragment is not sent to the server. The official billNav route is the
           * server-rendered text surface for the same bill identity.
           */
          export function derive_california_official_text_url(source_url: string): string | null {
            let parsed: URL;
            try {
              parsed = new URL(source_url);
            } catch {
              return null;
            }
            if (parsed.hostname.toLowerCase() !== "leginfo.legislature.ca.gov") return null;
            if (!/\\/faces\\/billTextClient\\.xhtml$/i.test(parsed.pathname)) return null;
            const bill_id = parsed.searchParams.get("bill_id")?.trim();
            if (!bill_id) return null;
            const canonical = new URL("https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml");
            canonical.searchParams.set("bill_id", bill_id);
            return canonical.toString();
          }

          '''
          if local_function not in source:
            raise SystemExit('local California function not found')
          source = source.replace(local_function, '', 1)

          old_fetch = '''  const source_url = derive_california_official_text_url(selected_source_url)
            ?? selected_source_url;
          const official = await fetch_bytes(source_url);
          const source_byte_hash = sha256(official.bytes);
          const is_pdf = official.bytes.subarray(0, 5).toString("ascii") === "%PDF-";
          const html_url = is_pdf ? derive_wa_official_html_url(source_url) : null;
          '''
          new_fetch = '''  const california_page_url = derive_california_official_text_url(selected_source_url);
          const california_pdf = california_page_url
            ? await fetch_california_official_pdf(selected_source_url)
            : null;
          const source_url = california_pdf?.source_url ?? selected_source_url;
          const official = california_pdf
            ? { bytes: california_pdf.bytes, content_type: "application/pdf" }
            : await fetch_bytes(source_url);
          const source_byte_hash = sha256(official.bytes);
          const is_pdf = official.bytes.subarray(0, 5).toString("ascii") === "%PDF-";
          const html_url = is_pdf && !california_pdf
            ? derive_wa_official_html_url(source_url)
            : null;
          '''
          if old_fetch not in source:
            raise SystemExit('source fetch block not found')
          source = source.replace(old_fetch, new_fetch, 1)

          old_pdf = '''  } else if (is_pdf) {
            source_text = await extract_pdf_text(official.bytes);
            source_version = `legiscan_text:${doc_id}:${document_type}:${PDF_EXTRACTOR_VERSION}`;
            extractor_version = PDF_EXTRACTOR_VERSION;
            media_type = "application/pdf";
          '''
          new_pdf = '''  } else if (is_pdf) {
            source_text = await extract_pdf_text(official.bytes);
            source_version = california_pdf
              ? `legiscan_text:${doc_id}:${document_type}:${CA_PDF_EXTRACTOR_VERSION}`
              : `legiscan_text:${doc_id}:${document_type}:${PDF_EXTRACTOR_VERSION}`;
            extractor_version = california_pdf
              ? CA_PDF_EXTRACTOR_VERSION
              : PDF_EXTRACTOR_VERSION;
            media_type = "application/pdf";
          '''
          if old_pdf not in source:
            raise SystemExit('PDF extraction block not found')
          source = source.replace(old_pdf, new_pdf, 1)

          metadata_marker = '''      provider_state_link: selected_source_url,
                source_url_rewritten: source_url !== selected_source_url,
                docket_source_content_type: official.content_type,
          '''
          metadata_replacement = '''      provider_state_link: selected_source_url,
                source_url_rewritten: source_url !== selected_source_url,
                california_bill_page_url: california_pdf?.bill_page_url ?? null,
                california_session_bootstrapped: california_pdf?.session_bootstrapped ?? false,
                docket_source_content_type: official.content_type,
          '''
          if metadata_marker not in source:
            raise SystemExit('metadata marker not found')
          source = source.replace(metadata_marker, metadata_replacement, 1)

          path.write_text(source)
          Path('.github/workflows/apply-california-official-pdf-session.yml').unlink()
          PY

      - name: Commit bounded integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/civic-genome-rosetta-extraction.ts \
                  .github/workflows/apply-california-official-pdf-session.yml
          git commit -m "Use session-aware California official PDF source"
          git push origin HEAD:fix/california-official-pdf-session
