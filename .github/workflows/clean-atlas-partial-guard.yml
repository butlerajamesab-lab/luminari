name: Clean Atlas Partial Guard

on:
  push:
    branches:
      - fix/atlas-stream-recovery
    paths:
      - scripts/clean-atlas-partial-guard.mjs
      - .github/workflows/clean-atlas-partial-guard.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/atlas-stream-recovery
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Remove duplicate partial guard
        run: node scripts/clean-atlas-partial-guard.mjs

      - name: Run focused Atlas contracts
        run: >-
          npx vitest run
          server/ingestion/__tests__/atlas-stream-bridge-contract.test.ts
          server/ingestion/__tests__/atlas-stream-partial-progress-contract.test.ts
          server/ingestion/__tests__/atlas-stream-registry-recovery-contract.test.ts

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit clean implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove duplicate Atlas partial-result guard"
          git push origin HEAD:fix/atlas-stream-recovery
