name: Atlas Stream Production Smoke

on:
  push:
    branches:
      - ops/atlas-stream-smoke-20260729
    paths:
      - ".github/workflows/atlas-stream-production-smoke.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout smoke branch
        uses: actions/checkout@v4
        with:
          ref: ops/atlas-stream-smoke-20260729
          fetch-depth: 0

      - name: Wait for merged main deployment
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          expected_commit="$(git rev-parse origin/main)"
          observed_commit=""
          for attempt in $(seq 1 72); do
            response="$(curl -fsS --max-time 25 https://luminari.onrender.com/api/runtime-build || true)"
            observed_commit="$(RESPONSE="$response" node -e 'try { const v=JSON.parse(process.env.RESPONSE || "{}"); process.stdout.write(String(v.render_git_commit || "")); } catch {}')"
            echo "attempt=$attempt expected=$expected_commit observed=$observed_commit"
            if [ "$observed_commit" = "$expected_commit" ]; then
              break
            fi
            sleep 10
          done
          if [ "$observed_commit" != "$expected_commit" ]; then
            echo "Render did not reach expected commit $expected_commit" >&2
            exit 1
          fi
          echo "expected_commit=$expected_commit" >> "$GITHUB_OUTPUT"
          echo "observed_commit=$observed_commit" >> "$GITHUB_OUTPUT"

      - name: Run bounded USDA SNAP bridge smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 120 \
            -H 'content-type: application/json' \
            --data '{"stream_id":"usda_snap"}' \
            https://luminari.onrender.com/api/executor/run_stream \
            > atlas-stream-smoke-response.json
          cat atlas-stream-smoke-response.json
          node <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync('atlas-stream-smoke-response.json', 'utf8'));
          const errors = Array.isArray(response.errors) ? response.errors : [];
          if (!Number.isInteger(Number(response.run_id)) || Number(response.run_id) <= 0) {
            throw new Error(`Missing positive run_id: ${JSON.stringify(response)}`);
          }
          if (errors.length > 0) {
            throw new Error(`Bridge returned errors: ${errors.join('; ')}`);
          }
          if (response?.diagnostics?.adapter_used !== 'atlas_stream') {
            throw new Error(`Unexpected adapter: ${JSON.stringify(response?.diagnostics)}`);
          }
          if (response?.diagnostics?.outcome_classification !== 'completed') {
            throw new Error(`Unexpected outcome: ${JSON.stringify(response?.diagnostics)}`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '# Atlas production smoke receipt',
            '',
            `- Stream: usda_snap`,
            `- Run ID: ${response.run_id}`,
            `- Records processed: ${response.records_processed}`,
            `- Records inserted: ${response.records_inserted}`,
            `- Records updated: ${response.records_updated}`,
            `- Adapter: ${response.diagnostics.adapter_used}`,
            `- Outcome: ${response.diagnostics.outcome_classification}`,
            '',
          ].join('\n'));
          NODE

      - name: Upload smoke receipt
        uses: actions/upload-artifact@v4
        with:
          name: atlas-stream-production-smoke
          path: atlas-stream-smoke-response.json

      - name: Remove temporary smoke workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/atlas-stream-production-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-time Atlas production smoke workflow"
            git push origin HEAD:ops/atlas-stream-smoke-20260729
          fi
