name: Reconcile Sovereign Spine Portability

on:
  push:
    branches:
      - fix/sovereign-spine-portability

permissions:
  contents: write

concurrency:
  group: reconcile-sovereign-spine-portability
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portability branch
        uses: actions/checkout@v4
        with:
          ref: fix/sovereign-spine-portability
          fetch-depth: 0

      - name: Finalize signed export contract
        run: python3 scripts/finalize-sovereign-spine-export.py

      - name: Add PostgreSQL enum portability
        run: python3 scripts/add-sovereign-spine-enum-portability.py

      - name: Validate durable portability contract
        run: |
          grep -q 'registryTables' server/engines/sovereign-export-spine-engine.ts
          grep -q 'rowLimitPerTable: 100_000' server/engines/sovereign-export-spine-engine.ts
          grep -q 'export_spine_database_enums' server/engines/sovereign-export-spine-engine.ts
          grep -q 'create type public' server/engines/spine-postgres.ts
          grep -q 'verify_spine_bundle' server/engines/sovereign-restore-spine-engine.ts
          grep -q 'completed_with_errors' server/engines/sovereign-restore-spine-engine.ts
          ! grep -q 'ON DUPLICATE KEY' server/engines/sovereign-restore-spine-engine.ts
          ! grep -q 'insertId' server/engines/sovereign-export-spine-engine.ts
          ! grep -q 'insertId' server/engines/sovereign-restore-spine-engine.ts

      - name: Remove bounded staging machinery
        run: |
          git rm scripts/finalize-sovereign-spine-export.py
          git rm scripts/add-sovereign-spine-enum-portability.py
          git rm .github/workflows/reconcile-sovereign-spine-portability.yml

      - name: Commit reconciled portability engine
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Reconcile signed PostgreSQL Sovereign Spine [sovereign-spine-portability]'
          git push origin HEAD:fix/sovereign-spine-portability
