name: Align Governance Chain Status

on:
  push:
    branches:
      - fix/sovereign-continuity-core

permissions:
  contents: write

concurrency:
  group: align-governance-chain-status
  cancel-in-progress: false

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout continuity branch
        uses: actions/checkout@v4
        with:
          ref: fix/sovereign-continuity-core
          fetch-depth: 0

      - name: Align chain status response
        run: python3 scripts/align-governance-chain-status.py

      - name: Validate dashboard contract
        run: |
          grep -q 'lastSeqNo,' server/routers/governance-router.ts
          grep -q 'lastEntryAt,' server/routers/governance-router.ts
          grep -q 'last_seq_no: lastSeqNo' server/routers/governance-router.ts

      - name: Remove bounded staging machinery
        run: |
          git rm scripts/align-governance-chain-status.py
          git rm .github/workflows/align-governance-chain-status.yml

      - name: Commit aligned governance response
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Align constitutional governance chain status [governance-chain-status]'
          git push origin HEAD:fix/sovereign-continuity-core
