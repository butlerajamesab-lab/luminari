      - "client/src/pages/SignalRegistry.tsx"
      - "client/src/pages/SignalRegistry.test.tsx"
      - "client/src/components/signal-architecture/**"
      - "client/src/pages/ControlRoom.tsx"
      - "client/src/pages/AnomalyViewfinder.tsx"
      - "client/src/components/viewfinder/**"
      - "server/anomaly-viewfinder-live.contract.test.ts"
      - "client/src/pages/StructuralDiagnosticsLens.tsx"
      - "client/src/pages/StructuralDiagnosticsLens.test.tsx"
      - "client/src/lib/diagnosticsView.ts"
      - "client/src/pages/ContradictionScoring.tsx"
      - "client/src/pages/ContradictionScoring.test.tsx"
      - "client/src/features/integrity-review/IntegrityReview.tsx"
      - ".github/workflows/signal-architecture-contract.yml"
      - "tsconfig.diagnostics.json"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm install --legacy-peer-deps
      - name: Run focused boundary contracts
        run: >-
          npx vitest run
          server/signal-architecture-ground-truth.test.ts
          server/signal-domain2-prism-currentness.test.ts
          server/signal-architecture-runtime-observability-current.test.ts
          server/signal-artifact-runtime.test.ts
          server/signal-artifact-navigation.contract.test.ts
          server/anomaly-viewfinder-live.contract.test.ts
          client/src/components/viewfinder/ViewfinderArtifactFeed.test.tsx
          client/src/components/signal-architecture/SignalEvidenceDetails.test.tsx
          client/src/pages/ContradictionScoring.test.tsx
          client/src/pages/SignalRegistry.test.tsx
          client/src/pages/StructuralDiagnosticsLens.test.tsx
          server/intake-pattern-catalog.test.ts
          server/diagnostics-router-wiring.test.ts
      - name: Verify formatting
        run: git diff --check
      - name: Check diagnostics against its actual API contract
        run: npx tsc --noEmit -p tsconfig.diagnostics.json
