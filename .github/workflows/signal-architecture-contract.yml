      - "server/diagnostic-signal-runtime.ts"
      - "server/diagnostic-reference-contract.ts"
      - "client/src/pages/CaseResolutionLens.tsx"
      - "server/intake-pattern-catalog.ts"
      - "server/intake-pattern-catalog.test.ts"
      - "server/signal-artifact-runtime.ts"
