name: Genome expired legacy lease retirement preflight

on:
  pull_request:
    paths:
      - 'supabase/migration_sources/retire_expired_genome_legacy_leases_20261017_PREPARED.sql'
      - 'supabase/verification/genome_expired_legacy_lease_fixture_20261017.sql'
      - 'scripts/prepare_genome_expired_lease_fixture.py'
      - '.github/workflows/genome-expired-legacy-lease-preflight.yml'

permissions:
  contents: read

jobs:
  isolated-expired-leases:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: genome_retirement_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d genome_retirement_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: genome_retirement_test
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
      - name: Create exact 15 submitted and 5 eligible August-locked jobs and original sources
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/verification/genome_expired_legacy_lease_fixture_20261017.sql
      - name: Prove live production SHA and trigger pins reject unrelated fixture data
        run: |
          if psql -X -v ON_ERROR_STOP=1 \
             -f supabase/migration_sources/retire_expired_genome_legacy_leases_20261017_PREPARED.sql > /tmp/prod-pin-denial.log 2>&1; then
            echo "UNSAFE: live production SHA accepted independent fixture"
            exit 1
          fi
          grep -q 'genome_lease_retirement_queue_guard_drift' /tmp/prod-pin-denial.log
          test "$(psql -X -Atqc 'select count(*) from public.civic_genome_legislative_version_queue')" = 20
      - name: Reject newly renewed leases even with exact fixture-specific SHA pins
        run: |
          psql -X -v ON_ERROR_STOP=1 -c \
            "update public.civic_genome_legislative_version_queue set locked_at=now(),updated_at=now() where queue_id='11111111-1111-4111-8111-000000000001';"
          python3 scripts/prepare_genome_expired_lease_fixture.py /tmp/renewed-lease.sql
          if psql -X -v ON_ERROR_STOP=1 -f /tmp/renewed-lease.sql > /tmp/recent-refusal.log 2>&1; then
            echo "UNSAFE: candidate retired a recent job lease"
            exit 1
          fi
          grep -q 'genome_lease_retirement_recent_or_out_of_scope_claim' /tmp/recent-refusal.log
          test "$(psql -X -Atqc "select count(*) from public.civic_genome_legislative_version_queue where locked_by is not null")" = 20
          psql -X -v ON_ERROR_STOP=1 -c \
            "update public.civic_genome_legislative_version_queue set locked_at='2026-08-07T00:00:00Z',updated_at='2026-08-18T00:00:00Z' where queue_id='11111111-1111-4111-8111-000000000001';"
      - name: Prove exact fixture-only lease terminal retirement without identity loss
        run: |
          python3 scripts/prepare_genome_expired_lease_fixture.py /tmp/fixture-lease-retirement.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/fixture-lease-retirement.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF (SELECT count(*) FROM public.docket_bill_source_document) <> 20
              OR (SELECT count(*) FROM public.civic_genome_bill_version) <> 20
              OR (SELECT count(*) FROM public.civic_genome_legislative_version_queue) <> 20
              OR (SELECT count(*) FROM public.civic_genome_legislative_version_queue
                   WHERE queue_state='permanent_failure'
                     AND next_attempt_at='infinity'::timestamptz
                     AND locked_by IS NULL AND locked_at IS NULL
                     AND last_failure_class='retired_legacy_generation'
                     AND last_error_code='legacy_conveyor_retired_no_replay') <> 20
              OR (SELECT count(*) FROM public.civic_genome_bill_version
                  WHERE rosetta_extraction_run_id IS NOT NULL) <> 20
            THEN
              RAISE EXCEPTION 'exact lease retirement or source conservation failed';
            END IF;
          END;$verify$;
          SQL
