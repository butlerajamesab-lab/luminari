name: Supabase Fresh Replay

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/supabase-fresh-replay.yml"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "supabase/verification/**"
      - "scripts/audit-supabase-migration-ledger-parity.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-fresh-replay.yml"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "supabase/verification/**"
      - "scripts/audit-supabase-migration-ledger-parity.py"
  workflow_dispatch:

concurrency:
  group: supabase-fresh-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Rebuild database from zero
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start isolated Supabase database
        run: supabase db start

      - name: Replay every migration from zero
        run: supabase db reset --local --no-seed --debug

      - name: Lint replayed database
        run: supabase db lint --local --level error --fail-on error
