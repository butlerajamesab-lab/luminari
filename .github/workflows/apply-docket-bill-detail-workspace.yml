name: Apply Docket bill detail workspace

on:
  push:
    branches:
      - fix/docket-bill-detail-workspace
    paths:
      - .github/workflows/apply-docket-bill-detail-workspace.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/docket-bill-detail-workspace
          fetch-depth: 0
      - name: Write structured bill detail component and wire Docket Room
        shell: bash
        run: |
          test ! -f client/src/components/DocketBillDetailWorkspace.tsx
          python - <<'PY'
          from pathlib import Path
          component = r'''import { useMemo, useState } from "react";

type bill_detail_payload = { source?: string; fetched_at?: string; bill?: Record<string, unknown> };
type unknown_record = Record<string, unknown>;
const p = { bg: "#0f1114", slate: "#1a1e24", slate_mid: "#232830", paper: "#e8ecf0", cream: "#d0d7de", muted: "#7d8590", rule: "#30363d", steel: "#58a6ff", steel_soft: "rgba(74,140,199,0.12)", copper: "#d29922", copper_soft: "rgba(210,153,34,0.12)" };
const mono = "'IBM Plex Mono', monospace";
const sans = "'Inter', system-ui, sans-serif";
const serif = "'Cormorant Garamond', serif";
const is_record = (value: unknown): value is unknown_record => Boolean(value) && typeof value === "object" && !Array.isArray(value);
const as_array = (value: unknown): unknown[] => Array.isArray(value) ? value : [];
const first_value = (record: unknown_record, keys: string[]): unknown => { for (const key of keys) { const value = record[key]; if (value !== undefined && value !== null && value !== "") return value; } return null; };
const display_value = (value: unknown): string => { if (value === null || value === undefined || value === "") return "Not provided"; if (["string", "number", "boolean"].includes(typeof value)) return String(value); if (Array.isArray(value)) return value.map(display_value).join(", "); return JSON.stringify(value); };
const record_label = (value: unknown): string => { if (!is_record(value)) return display_value(value); const label = first_value(value, ["name", "title", "description", "action", "text", "committee_name", "sponsor_name", "person_name", "motion", "vote_desc", "doc_desc", "party", "role", "number", "type"]); return label ? display_value(label) : "Record"; };
const record_url = (value: unknown): string | null => { if (!is_record(value)) return null; const url = first_value(value, ["url", "state_link", "text_url", "doc_url", "source_url"]); return typeof url === "string" && /^https?:\/\//i.test(url) ? url : null; };
function Field({ label, value, wide = false }: { label: string; value: unknown; wide?: boolean }) { if (value === null || value === undefined || value === "") return null; return <div style={{ minWidth: 0, gridColumn: wide ? "1 / -1" : undefined }}><div style={{ fontFamily: mono, fontSize: "0.64rem", color: p.muted, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: "0.22rem" }}>{label}</div><div style={{ fontFamily: sans, fontSize: "0.82rem", color: p.cream, lineHeight: 1.45, overflowWrap: "anywhere" }}>{display_value(value)}</div></div>; }
function Section({ title, items }: { title: string; items: unknown[] }) { if (!items.length) return null; return <section style={{ background: p.bg, border: `1px solid ${p.rule}`, borderRadius: 8, padding: "0.85rem" }}><div style={{ fontFamily: mono, fontSize: "0.7rem", color: p.steel, fontWeight: 700, textTransform: "uppercase", marginBottom: "0.65rem" }}>{title}</div><div style={{ display: "grid", gap: "0.55rem" }}>{items.map((item, index) => <div key={index} style={{ background: p.slate, border: `1px solid ${p.rule}`, borderRadius: 6, padding: "0.65rem" }}><div style={{ fontFamily: sans, fontSize: "0.82rem", color: p.paper, lineHeight: 1.4 }}>{record_label(item)}</div>{is_record(item) && <div style={{ display: "flex", gap: "0.75rem", flexWrap: "wrap", marginTop: "0.35rem", fontFamily: mono, fontSize: "0.64rem", color: p.muted }}>{Object.entries(item).slice(0, 6).map(([key, value]) => typeof value !== "object" && value !== null && value !== "" ? <span key={key}>{key} {String(value)}</span> : null)}</div>}{record_url(item) && <a href={record_url(item)!} target="_blank" rel="noopener noreferrer" style={{ display: "inline-block", marginTop: "0.4rem", color: p.steel, fontFamily: mono, fontSize: "0.65rem" }}>Open official record</a>}</div>)}</div></section>; }
export function DocketBillDetailWorkspace({ payload }: { payload: bill_detail_payload }) { const [show_raw, set_show_raw] = useState(false); const bill = is_record(payload.bill) ? payload.bill : {}; const n = useMemo(() => ({ bill_id: first_value(bill,["bill_id","id"]), number: first_value(bill,["bill_number","number"]), title: first_value(bill,["title","description","bill_name"]), description: first_value(bill,["description","summary","abstract"]), status: first_value(bill,["status","status_desc","current_status"]), status_date: first_value(bill,["status_date","last_action_date"]), session: first_value(bill,["session","session_name","session_title","session_id"]), state: first_value(bill,["state","state_id","jurisdiction"]), url: first_value(bill,["url","state_link","source_url"]), last_action: first_value(bill,["last_action","action"]), last_action_date: first_value(bill,["last_action_date","status_date"]), sponsors: as_array(first_value(bill,["sponsors","sponsor"])), history: as_array(first_value(bill,["history","actions","action_history"])), committees: as_array(first_value(bill,["committees","committee","referrals"])), texts: as_array(first_value(bill,["texts","text","documents","versions"])), votes: as_array(first_value(bill,["votes","roll_calls","rollcalls"])), amendments: as_array(first_value(bill,["amendments","supplements"])), subjects: as_array(first_value(bill,["subjects","topics"])), calendar: as_array(first_value(bill,["calendar","calendar_entries"])), progress: as_array(first_value(bill,["progress"])) }), [bill]); const official_url = typeof n.url === "string" && /^https?:\/\//i.test(n.url) ? n.url : null; return <div style={{ display: "grid", gap: "0.85rem" }}><div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: "1rem", flexWrap: "wrap" }}><div style={{ minWidth: 0, flex: 1 }}><div style={{ fontFamily: mono, fontSize: "0.66rem", color: p.steel, marginBottom: "0.35rem" }}>source {payload.source || "unknown"} · fetched_at {payload.fetched_at || "unknown"}</div><h3 style={{ fontFamily: serif, fontSize: "1.35rem", color: p.paper, lineHeight: 1.25, margin: 0 }}>{display_value(n.title)}</h3>{n.description && n.description !== n.title && <p style={{ fontFamily: sans, fontSize: "0.86rem", color: p.cream, lineHeight: 1.55, margin: "0.55rem 0 0" }}>{display_value(n.description)}</p>}</div>{official_url && <a href={official_url} target="_blank" rel="noopener noreferrer" style={{ background: p.steel_soft, border: `1px solid ${p.steel}`, borderRadius: 6, padding: "0.45rem 0.65rem", color: p.steel, fontFamily: mono, fontSize: "0.68rem", textDecoration: "none" }}>Open official bill</a>}</div><div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(155px, 1fr))", gap: "0.75rem", background: p.bg, border: `1px solid ${p.rule}`, borderRadius: 8, padding: "0.85rem" }}><Field label="Bill number" value={n.number}/><Field label="Bill ID" value={n.bill_id}/><Field label="Jurisdiction" value={n.state}/><Field label="Session" value={n.session}/><Field label="Status" value={n.status}/><Field label="Status date" value={n.status_date}/><Field label="Last action" value={n.last_action} wide/><Field label="Last action date" value={n.last_action_date}/></div><div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: "0.75rem" }}><Section title="Legislative history" items={n.history}/><Section title="Sponsors" items={n.sponsors}/><Section title="Committees and referrals" items={n.committees}/><Section title="Bill texts and documents" items={n.texts}/><Section title="Votes" items={n.votes}/><Section title="Amendments and supplements" items={n.amendments}/><Section title="Subjects" items={n.subjects}/><Section title="Calendar" items={n.calendar}/><Section title="Progress markers" items={n.progress}/></div><div style={{ background: p.copper_soft, border: `1px solid ${p.copper}`, borderRadius: 8, padding: "0.75rem", fontFamily: sans, fontSize: "0.78rem", color: p.cream, lineHeight: 1.45 }}>Official bill detail is shown above exactly as returned by the cached LegiScan detail request. Rosetta analysis and Civic Genome relationships remain separate until verified enrichment records exist for this bill.</div><button type="button" onClick={() => set_show_raw(value => !value)} style={{ justifySelf: "start", background: p.slate_mid, border: `1px solid ${p.rule}`, borderRadius: 6, color: p.muted, cursor: "pointer", fontFamily: mono, fontSize: "0.66rem", padding: "0.4rem 0.55rem" }}>{show_raw ? "hide_raw_source_payload" : "show_raw_source_payload"}</button>{show_raw && <pre style={{ whiteSpace: "pre-wrap", margin: 0, color: p.cream, background: p.bg, border: `1px solid ${p.rule}`, borderRadius: 8, padding: "0.75rem", fontFamily: mono, fontSize: "0.66rem", maxHeight: 420, overflow: "auto" }}>{JSON.stringify(payload, null, 2)}</pre>}</div>; }
'''
          Path("client/src/components/DocketBillDetailWorkspace.tsx").write_text(component)
          path = Path("client/src/pages/DocketRoom.tsx")
          text = path.read_text()
          anchor = 'import { VoiceReadout } from "@/components/VoiceReadout";\n'
          addition = 'import { DocketBillDetailWorkspace } from "@/components/DocketBillDetailWorkspace";\n'
          if addition not in text:
              text = text.replace(anchor, anchor + addition, 1)
          old = '{bill_detail_loading ? <div style={{ fontFamily: fontMono, fontSize: "0.72rem", color: dk.muted }}>loading_bill_detail</div> : bill_detail_error ? <div style={{ fontFamily: fontMono, fontSize: "0.72rem", color: dk.red }}>error {bill_detail_error}</div> : bill_detail ? <pre style={{ whiteSpace: "pre-wrap", margin: 0, color: dk.cream, fontFamily: fontMono, fontSize: "0.68rem", maxHeight: 320, overflow: "auto" }}>{JSON.stringify({ source: bill_detail.source, fetched_at: bill_detail.fetched_at, bill: bill_detail.bill }, null, 2)}</pre> : null}'
          new = '{bill_detail_loading ? <div style={{ fontFamily: fontMono, fontSize: "0.72rem", color: dk.muted }}>loading_bill_detail</div> : bill_detail_error ? <div style={{ fontFamily: fontMono, fontSize: "0.72rem", color: dk.red }}>error {bill_detail_error}</div> : bill_detail ? <DocketBillDetailWorkspace payload={bill_detail} /> : null}'
          if old not in text:
              raise SystemExit("raw detail anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/DocketRoom.tsx client/src/components/DocketBillDetailWorkspace.tsx
          git commit -m "Render full Docket bill detail workspace"
          git push origin HEAD:fix/docket-bill-detail-workspace
