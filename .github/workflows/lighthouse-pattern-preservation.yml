name: Lighthouse pattern preservation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lighthouse-pattern-preservation.yml"
      - "scripts/verify-lighthouse-pattern-preservation.py"
      - "scripts/verify-lighthouse-view-foundations.py"
      - "scripts/verify-signal-integrity-supersession.py"
      - "scripts/verify-lighthouse-legacy-preflight.py"
      - "scripts/verify-lighthouse-compat-type-preflight.py"
      - "supabase/migrations/20260801074427_math_engine_v21_correctness.sql"
      - "scripts/verify-legacy-function-argument-preservation.py"
      - "supabase/migrations/20260829094000_legacy_function_resolution_bridges.sql"
      - "supabase/verification/20260829094000_legacy_function_resolution_bridges_verify.sql"
      - "supabase/migrations/20260909142600_lighthouse_compat_type_preflight.sql"
      - "supabase/migrations/20260909142800_lighthouse_pattern_identity_preflight.sql"
      - "supabase/migrations/20260909142900_lighthouse_legacy_runtime_preflight.sql"
      - "supabase/migrations/20260818095500_signal_architecture_runtime_projection_truth.sql"
      - "supabase/migrations/20260822080454_atlas_domain3_integrity_review_projection.sql"
      - "supabase/migrations/20260815081130_case_surface_tables_foundation.sql"
      - "supabase/migrations/20260816063000_visibility_legacy_tables_foundation.sql"
      - "supabase/migrations/20260909143000_lighthouse_runtime_postgres_contract_v1.sql"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lighthouse-pattern-preservation.yml"
      - "scripts/verify-lighthouse-pattern-preservation.py"
      - "scripts/verify-lighthouse-view-foundations.py"
      - "scripts/verify-signal-integrity-supersession.py"
      - "scripts/verify-lighthouse-legacy-preflight.py"
      - "scripts/verify-lighthouse-compat-type-preflight.py"
      - "supabase/migrations/20260801074427_math_engine_v21_correctness.sql"
      - "scripts/verify-legacy-function-argument-preservation.py"
      - "supabase/migrations/20260829094000_legacy_function_resolution_bridges.sql"
      - "supabase/verification/20260829094000_legacy_function_resolution_bridges_verify.sql"
      - "supabase/migrations/20260909142600_lighthouse_compat_type_preflight.sql"
      - "supabase/migrations/20260909142800_lighthouse_pattern_identity_preflight.sql"
      - "supabase/migrations/20260909142900_lighthouse_legacy_runtime_preflight.sql"
      - "supabase/migrations/20260818095500_signal_architecture_runtime_projection_truth.sql"
      - "supabase/migrations/20260822080454_atlas_domain3_integrity_review_projection.sql"
      - "supabase/migrations/20260815081130_case_surface_tables_foundation.sql"
      - "supabase/migrations/20260816063000_visibility_legacy_tables_foundation.sql"
      - "supabase/migrations/20260909143000_lighthouse_runtime_postgres_contract_v1.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preservation:
    name: Preserve pattern rows and original dates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lighthouse_runtime_contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lighthouse_runtime_contract_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PATTERN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lighthouse_runtime_contract_test
    steps:
      - uses: actions/checkout@v7
      - name: Verify production view conversion and legacy table replay
        run: python3 scripts/verify-lighthouse-pattern-preservation.py
      - name: Verify foundations preserve existing production views
        run: python3 scripts/verify-lighthouse-view-foundations.py
      - name: Verify recorded production signal-view supersession
        run: python3 scripts/verify-signal-integrity-supersession.py
      - name: Verify predecessor UUID patterns and workflow columns
        run: python3 scripts/verify-lighthouse-legacy-preflight.py
      - name: Verify production compatibility aliases survive type conversion
        run: python3 scripts/verify-lighthouse-compat-type-preflight.py
      - name: Verify legacy function argument names and dependencies
        run: python3 scripts/verify-legacy-function-argument-preservation.py
