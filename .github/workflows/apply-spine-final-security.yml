name: Apply Spine Final Security

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - "scripts/apply-spine-final-security.py"
      - "scripts/.spine-final-security-trigger"
      - ".github/workflows/apply-spine-final-security.yml"

permissions:
  contents: write

concurrency:
  group: apply-spine-security-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply bounded security corrections
        run: python scripts/apply-spine-final-security.py

      - name: Validate durable result
        run: |
          grep -q 'SPINE_STATIC_CIVIC_TABLES' server/engines/sovereign-export-spine-engine-v2.ts
          grep -q 'value instanceof Date' server/engines/sovereign-export-spine-engine-v2.ts
          grep -q 'legacyOverride && signatureAbsent' server/engines/spine-bundle-contract.ts
          grep -q 'restore_static_spine_table_data' server/engines/sovereign-restore-spine-engine.ts
          ! grep -q 'REGISTRY_RESTORE_POLICY' server/engines/sovereign-restore-spine-engine.ts

      - name: Remove staging machinery
        run: |
          rm -f scripts/apply-spine-final-security.py
          rm -f scripts/.spine-final-security-trigger
          rm -f .github/workflows/apply-spine-final-security.yml

      - name: Commit durable security corrections
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply final Sovereign Spine security policies"
          git push origin HEAD:${{ github.head_ref }}
