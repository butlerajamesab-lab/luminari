name: Patch Rosetta 2.5.11 marked-reprint handoff from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/civic-genome-rosetta-v2511-marked-reprint-handoff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/civic-genome-rosetta-v2511-marked-reprint-handoff
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Apply exact guarded patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          assembly_path = Path('server/civic-genome-rosetta-assembly.ts')
          static_test_path = Path('server/civic-genome-rosetta-structural-representation-contract.test.ts')
          unit_path = Path('server/civic-genome-rosetta-v2511-marked-reprint-handoff.test.ts')

          assembly = assembly_path.read_text()
          static_test = static_test_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}_anchor_count:{count}')
              return text.replace(old, new, 1)

          constants_old = '''export const ROSETTA_GENOME_STRUCTURAL_ENGINE_VERSION = "rosetta-genome-assembly-v2";
          export const ROSETTA_GENOME_STRUCTURAL_RULE_VERSION = "rosetta-five-layer-plus-structural-evidence-v2";
          '''.replace('          ', '')
          constants_new = '''export const ROSETTA_GENOME_STRUCTURAL_ENGINE_VERSION = "rosetta-genome-assembly-v2";
          export const ROSETTA_GENOME_STRUCTURAL_RULE_VERSION = "rosetta-five-layer-plus-structural-evidence-v2";
          export const ROSETTA_V2511_ENGINE_VERSION = "rosetta-v3-deterministic-sql-2.5.11";
          export const ROSETTA_V2511_RULE_SET_VERSION = "rosetta-five-layer-structural-correctness-2.5.11";
          export const ROSETTA_V2511_RULE_MANIFEST_HASH = "3602eb80fee71a4009bf7a04c521fec62e2d1f17f8ea5b027500905cd8366639";
          '''.replace('          ', '')
          assembly = replace_once(assembly, constants_old, constants_new, 'constants')

          verification_old = '''function verification_state(view: civic_genome_rosetta_law_view): "complete" | "partial" {
            const covered = Object.values(view.law_view.coverage).filter(value => value === 1).length;
            return view.law_view.provenanceState === "complete" && covered === 5 ? "complete" : "partial";
          }
          '''.replace('          ', '')
          verification_new = '''function verification_state(view: civic_genome_rosetta_law_view): "complete" | "partial" {
            const covered = Object.values(view.law_view.coverage).filter(value => value === 1).length;
            return view.law_view.provenanceState === "complete" && covered === 5 ? "complete" : "partial";
          }

          export function is_v2511_marked_full_text_reprint_handoff(
            view: civic_genome_rosetta_law_view,
          ): boolean {
            return view.handoff_contract_version === ROSETTA_HANDOFF_STRUCTURAL_REPRESENTATION_V2
              && view.document_type === "bill_amendment"
              && view.engine_version === ROSETTA_V2511_ENGINE_VERSION
              && view.rule_set_version === ROSETTA_V2511_RULE_SET_VERSION
              && view.rule_manifest_hash === ROSETTA_V2511_RULE_MANIFEST_HASH
              && view.run_status?.toLowerCase() === "completed"
              && view.admissibility_state === "admissible"
              && view.law_view.provenanceState === "complete"
              && verification_state(view) === "complete"
              && view.law_view.objects.length === 0
              && view.structural_representations.length === 0;
          }
          '''.replace('          ', '')
          assembly = replace_once(assembly, verification_old, verification_new, 'verification')

          zero_old = '''  if (view.law_view.objects.length === 0) {
            if (!contract.structural_evidence || view.structural_representations.length === 0) {
              throw new Error("rosetta_completed_run_has_no_operative_or_structural_evidence");
            }
            if (view.document_type !== "bill_amendment") {
              throw new Error("rosetta_zero_operative_objects_only_allowed_for_structural_amendment_handoff");
            }
            for (const representation of view.structural_representations) {
              if (representation.representation_type !== "source_stated_amendment_operation") {
                throw new Error("rosetta_zero_operative_objects_has_unsupported_structural_representation");
              }
              if (!is_record(representation.normalized_value)) {
                throw new Error("rosetta_amendment_structural_representation_invalid");
              }
              if (representation.normalized_value.operative_effect_applied !== false) {
                throw new Error("rosetta_amendment_structural_representation_applies_operative_effect");
              }
            }
          }
          '''.replace('          ', '')
          zero_new = '''  if (view.law_view.objects.length === 0) {
            if (view.structural_representations.length === 0) {
              if (!is_v2511_marked_full_text_reprint_handoff(view)) {
                throw new Error("rosetta_completed_run_has_no_operative_or_structural_evidence");
              }
            } else {
              if (!contract.structural_evidence) {
                throw new Error("rosetta_completed_run_has_no_operative_or_structural_evidence");
              }
              if (view.document_type !== "bill_amendment") {
                throw new Error("rosetta_zero_operative_objects_only_allowed_for_structural_amendment_handoff");
              }
              for (const representation of view.structural_representations) {
                if (representation.representation_type !== "source_stated_amendment_operation") {
                  throw new Error("rosetta_zero_operative_objects_has_unsupported_structural_representation");
                }
                if (!is_record(representation.normalized_value)) {
                  throw new Error("rosetta_amendment_structural_representation_invalid");
                }
                if (representation.normalized_value.operative_effect_applied !== false) {
                  throw new Error("rosetta_amendment_structural_representation_applies_operative_effect");
                }
              }
            }
          }
          '''.replace('          ', '')
          assembly = replace_once(assembly, zero_old, zero_new, 'zero_object_guard')

          static_old = '''  it("allows zero operative traits only for explicit non-operative amendment evidence", () => {
            expect(assembly).toContain("rosetta_completed_run_has_no_operative_or_structural_evidence");
            expect(assembly).toContain("rosetta_zero_operative_objects_only_allowed_for_structural_amendment_handoff");
            expect(assembly).toContain('representation.representation_type !== "source_stated_amendment_operation"');
            expect(assembly).toContain("representation.normalized_value.operative_effect_applied !== false");
          });
          '''.replace('          ', '')
          static_new = '''  it("allows zero operative traits only for governed non-operative amendment evidence", () => {
            expect(assembly).toContain("rosetta_completed_run_has_no_operative_or_structural_evidence");
            expect(assembly).toContain("is_v2511_marked_full_text_reprint_handoff(view)");
            expect(assembly).toContain('ROSETTA_V2511_ENGINE_VERSION = "rosetta-v3-deterministic-sql-2.5.11"');
            expect(assembly).toContain('ROSETTA_V2511_RULE_SET_VERSION = "rosetta-five-layer-structural-correctness-2.5.11"');
            expect(assembly).toContain('ROSETTA_V2511_RULE_MANIFEST_HASH = "3602eb80fee71a4009bf7a04c521fec62e2d1f17f8ea5b027500905cd8366639"');
            expect(assembly).toContain("rosetta_zero_operative_objects_only_allowed_for_structural_amendment_handoff");
            expect(assembly).toContain('representation.representation_type !== "source_stated_amendment_operation"');
            expect(assembly).toContain("representation.normalized_value.operative_effect_applied !== false");
          });
          '''.replace('          ', '')
          static_test = replace_once(static_test, static_old, static_new, 'static_test')

          unit = '''import { describe, expect, it } from "vitest";
          import {
            is_v2511_marked_full_text_reprint_handoff,
            ROSETTA_V2511_ENGINE_VERSION,
            ROSETTA_V2511_RULE_MANIFEST_HASH,
            ROSETTA_V2511_RULE_SET_VERSION,
          } from "./civic-genome-rosetta-assembly";
          import type { civic_genome_rosetta_law_view } from "./civic-genome-rosetta-contract";

          function make_view(
            overrides: Partial<civic_genome_rosetta_law_view> = {},
          ): civic_genome_rosetta_law_view {
            const base: civic_genome_rosetta_law_view = {
              extraction_run_id: 13148,
              source_document_id: 5654,
              corpus_id: 1,
              document_name: "marked amendment fixture",
              document_type: "bill_amendment",
              document_identifier: "fixture-5654",
              run_version: 1,
              run_status: "completed",
              confidence_threshold: 1,
              created_at: null,
              completed_at: null,
              handoff_contract_version: "rosetta-civic-genome-handoff-v2",
              structural_representations: [],
              engine_version: ROSETTA_V2511_ENGINE_VERSION,
              rule_set_version: ROSETTA_V2511_RULE_SET_VERSION,
              rule_manifest_hash: ROSETTA_V2511_RULE_MANIFEST_HASH,
              configuration_hash: "a".repeat(64),
              source_identity_hash: "b".repeat(64),
              source_content_hash: "c".repeat(64),
              output_content_hash: "d".repeat(64),
              admissibility_state: "admissible",
              source_url: "https://example.invalid/amendment.pdf",
              source_version: "fixture-v1",
              media_type: "application/pdf",
              source_byte_hash: null,
              source_provider_hash: null,
              law_view: {
                objects: [],
                coverage: {
                  help: 1,
                  workflow: 1,
                  accountability: 1,
                  override: 1,
                  definition: 1,
                },
                provenanceState: "complete",
              },
            };
            return {
              ...base,
              ...overrides,
              law_view: overrides.law_view ?? base.law_view,
            };
          }

          describe("Rosetta 2.5.11 marked full-text reprint handoff", () => {
            it("accepts only the exact current zero-object zero-structural amendment receipt", () => {
              expect(is_v2511_marked_full_text_reprint_handoff(make_view())).toBe(true);
            });

            it("rejects the same zero-zero shape from an older generation", () => {
              expect(is_v2511_marked_full_text_reprint_handoff(make_view({ engine_version: "rosetta-v3-deterministic-sql-2.5.10" }))).toBe(false);
            });

            it("rejects manifest drift", () => {
              expect(is_v2511_marked_full_text_reprint_handoff(make_view({ rule_manifest_hash: "0".repeat(64) }))).toBe(false);
            });

            it("rejects non-amendment zero-zero runs", () => {
              expect(is_v2511_marked_full_text_reprint_handoff(make_view({ document_type: "bill" }))).toBe(false);
            });

            it("rejects incomplete five-layer coverage", () => {
              expect(is_v2511_marked_full_text_reprint_handoff(make_view({
                law_view: {
                  objects: [],
                  coverage: { help: 1, workflow: 1, accountability: 1, override: 1, definition: 0 },
                  provenanceState: "complete",
                },
              }))).toBe(false);
            });

            it("rejects non-admissible runs", () => {
              expect(is_v2511_marked_full_text_reprint_handoff(make_view({ admissibility_state: "rejected" }))).toBe(false);
            });

            it("does not consume operation-sheet structural evidence as a marked reprint", () => {
              expect(is_v2511_marked_full_text_reprint_handoff(make_view({
                structural_representations: [{
                  key: "fixture-op",
                  representation_type: "source_stated_amendment_operation",
                  source_object_type: "rosetta_structural_representation",
                  source_object_id: "fixture-op",
                  source_block_id: "fixture-block",
                  extraction_run_id: "13148",
                  normalized_value: { operative_effect_applied: false },
                  confidence: 1,
                  confirmed: true,
                }],
              }))).toBe(false);
            });
          });
          '''.replace('          ', '')

          assembly_path.write_text(assembly)
          static_test_path.write_text(static_test)
          unit_path.write_text(unit)
          PY

      - name: Install dependencies
        run: npm install

      - name: Focused contract tests
        run: npx vitest run server/civic-genome-rosetta-structural-representation-contract.test.ts server/civic-genome-rosetta-v2511-marked-reprint-handoff.test.ts

      - name: Commit validated patch and remove one-shot workflows
        run: |
          git config user.name "butlerajamesab-lab"
          git config user.email "butlerajames.ab@gmail.com"
          git rm .github/workflows/patch-v2511-marked-reprint-handoff.yml \
                 .github/workflows/patch-v2511-marked-reprint-handoff-pr.yml
          git add server/civic-genome-rosetta-assembly.ts \
                  server/civic-genome-rosetta-structural-representation-contract.test.ts \
                  server/civic-genome-rosetta-v2511-marked-reprint-handoff.test.ts
          git diff --cached --check
          git commit -m "Accept governed Rosetta 2.5.11 marked-reprint handoff"
          git push origin HEAD:fix/civic-genome-rosetta-v2511-marked-reprint-handoff
