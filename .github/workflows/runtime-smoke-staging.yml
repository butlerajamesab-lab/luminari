name: Runtime Smoke (Staging DB)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *'

jobs:
  smoke:
    name: Non-empty runtime smoke checks (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run non-empty runtime smoke verification
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/verification/runtime_hotfix_smoke_nonempty.sql
