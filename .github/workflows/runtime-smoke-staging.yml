name: Runtime Smoke (Staging DB)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *'

jobs:
  smoke:
    name: Non-empty runtime smoke checks (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify DATABASE_URL is set
        id: check_url
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::STAGING_DATABASE_URL secret is not configured — skipping smoke checks."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL client
        if: steps.check_url.outputs.skip == 'false'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run non-empty runtime smoke verification
        if: steps.check_url.outputs.skip == 'false'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/verification/runtime_hotfix_smoke_nonempty.sql
