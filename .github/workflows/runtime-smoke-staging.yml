name: Runtime Smoke (Staging DB)

# Scheduled execution is intentionally disabled while STAGING_DATABASE_URL is
# absent from GitHub Actions. Keep this workflow manual and fail-closed until
# the credential is configured and a successful manual run proves the wiring.
on:
  workflow_dispatch:

jobs:
  smoke:
    name: Non-empty runtime smoke checks (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require staging database configuration
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::STAGING_DATABASE_URL is not configured for this workflow"
            exit 1
          fi
          case "$DATABASE_URL" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::STAGING_DATABASE_URL is not a PostgreSQL connection URL"
              exit 1
              ;;
          esac

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run non-empty runtime smoke verification
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/verification/runtime_hotfix_smoke_nonempty.sql
