name: Supabase migration ledger parity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production-ledger parity and bounded new migration
        run: python3 scripts/audit-supabase-migration-ledger-parity.py
      - name: Reject stale historical migration path references
        run: python3 scripts/audit-stale-migration-path-references.py
