name: Civic Genome external snapshot contract

on:
  pull_request:
    paths:
      - "contracts/civic_genome_external_snapshot.v1.schema.json"
      - "docs/CIVIC_GENOME_EXTERNAL_CONTRACTS_V1.md"
      - "docs/receipts/CIVIC_GENOME_EXTERNAL_SNAPSHOT_HB2487_PROOF_2026-08-03.json"
      - "server/civic-genome-external-snapshot-contract.ts"
      - "server/civic-genome-external-snapshot-contract.test.ts"
      - "server/civic-genome-external-snapshot-producer.ts"
      - "server/civic-genome-external-snapshot-producer.test.ts"
      - "server/civic-genome-external-snapshot-startup-proof.ts"
      - "server/civic-genome-kaleidoscope-contract.ts"
      - "server/civic-genome-kaleidoscope-contract.test.ts"
      - "server/civic-genome-kaleidoscope-handoff.ts"
      - "server/civic-genome-kaleidoscope-handoff-startup.ts"
      - "server/civic-genome-kaleidoscope-handoff.test.ts"
      - "server/civic-genome-prism-snapshot-handoff.ts"
      - "server/civic-genome-prism-snapshot-handoff-startup.ts"
      - "server/civic-genome-prism-snapshot-handoff.test.ts"
      - "server/civic-genome-operating-contracts.ts"
      - "server/lib/determinism.ts"
      - "server/lib/determinism.test.ts"
      - "server/_core/index.ts"
      - ".github/workflows/civic-genome-external-snapshot-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run snapshot, hashing, Kaleidoscope, and Prism handoff contracts
        run: >-
          npx vitest run
          server/civic-genome-external-snapshot-contract.test.ts
          server/civic-genome-external-snapshot-producer.test.ts
          server/civic-genome-kaleidoscope-contract.test.ts
          server/civic-genome-kaleidoscope-handoff.test.ts
          server/civic-genome-prism-snapshot-handoff.test.ts
          server/lib/determinism.test.ts
