name: Lighthouse Prism bridge

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prism-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: >-
          pnpm exec vitest run
          server/routes/prism-verification-router.test.ts
          server/services/prism-verification-contract.test.ts
          server/services/prism-rosetta-activation.test.ts
          server/services/prism-rosetta-startup-activation.test.ts
          server/services/prism-rosetta-queue-worker.test.ts
          server/civic-genome-legislative-version-spine.test.ts
          server/civic-genome-legislative-version-queue-worker.test.ts
          server/docket-jurisdiction-activation-queue-worker.test.ts
          server/docket-jurisdiction-rosetta-activation-contract.test.ts
          server/civic-genome-prism-v21-version-state.test.ts
      - run: pnpm run build
