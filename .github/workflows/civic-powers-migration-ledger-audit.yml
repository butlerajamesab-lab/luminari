          migration_files = sorted(Path('supabase/migrations').glob('*.sql'))
          local_by_version = {}
          for path in migration_files:
              version = path.name.split('_', 1)[0]
              local_by_version.setdefault(version, []).append(path.name)

          local_versions = set(local_by_version)
          missing = sorted(remote_versions - local_versions)
          duplicates = {v: names for v, names in local_by_version.items() if len(names) > 1}

          print(f'REMOTE_COUNT={len(remote_versions)}')
          print(f'LOCAL_FILE_COUNT={len(migration_files)}')
          print(f'MISSING_REMOTE_COUNT={len(missing)}')
          for version in missing:
              print(f'MISSING_REMOTE_VERSION={version}')
          print(f'DUPLICATE_LOCAL_VERSION_COUNT={len(duplicates)}')
          for version, names in sorted(duplicates.items()):
              print(f'DUPLICATE_LOCAL_VERSION={version}:{"|".join(names)}')

          if missing:
              raise SystemExit(1)
