name: Apply Rosetta Source Handoff Repair

on:
  push:
    branches:
      - fix/rosetta-source-handoff-terminality
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  reconstruct-test-and-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rosetta-source-handoff-terminality
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm

      - name: Reconstruct exact source files
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/rosetta-source-handoff/main.*.b64 | base64 --decode > server/civic-genome-rosetta-extraction.ts
          cat .repair/rosetta-source-handoff/test.*.b64 | base64 --decode > server/civic-genome-rosetta-extraction.test.ts
          echo 'a0033c57ba3d59e7d3c8a53c80d4fbfed9c1c3150d4f32a99d7d9ce9f821b9ca  server/civic-genome-rosetta-extraction.ts' | sha256sum --check
          echo '9d3188cf85112640f5b1e84069d958466144f4791b1d03e437cf52b431d2d3c3  server/civic-genome-rosetta-extraction.test.ts' | sha256sum --check

      - name: Install repository dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run targeted deterministic contracts
        run: pnpm exec vitest run server/civic-genome-rosetta-extraction.test.ts

      - name: Commit repaired producer path and remove staging artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repair/rosetta-source-handoff
          rm -f .github/workflows/apply-rosetta-source-handoff-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/civic-genome-rosetta-extraction.ts server/civic-genome-rosetta-extraction.test.ts .repair .github/workflows/apply-rosetta-source-handoff-repair.yml
          git commit -m 'Terminalize Rosetta source handoffs across PDF and HTML'
          git push origin HEAD:fix/rosetta-source-handoff-terminality
