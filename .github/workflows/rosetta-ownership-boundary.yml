name: Rosetta ownership boundary

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify ownership guard behavior
        run: python3 scripts/test_rosetta_ownership_boundary.py
      - name: Reject Rosetta implementation anywhere in Lighthouse
        run: python3 scripts/audit-rosetta-ownership-boundary.py
