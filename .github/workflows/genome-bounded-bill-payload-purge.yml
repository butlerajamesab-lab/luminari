name: Genome bounded bill payload purge
on:
  pull_request:
    paths:
      - 'supabase/migration_sources/purge_disqualified_genome_bill_payloads_20261017.sql'
      - 'supabase/verification/genome_bill_source_reconciliation_20261017.json'
      - 'supabase/verification/genome_bill_payload_trigger_baseline_20261017.sql'
      - 'scripts/test-genome-bill-payload-purge.cjs'
      - '.github/workflows/genome-bounded-bill-payload-purge.yml'
permissions:
  contents: read
jobs:
  bill-payload-purge-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: genome_quarantine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d genome_quarantine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture_only
      PGDATABASE: genome_quarantine_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - run: node scripts/test-genome-bill-payload-purge.cjs
