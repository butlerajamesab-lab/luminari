name: Patch Rosetta HTML Wrapper Preservation

on:
  push:
    branches:
      - fix/rosetta-source-handoff-terminality

permissions:
  contents: write

jobs:
  patch-test-and-clean:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rosetta-source-handoff-terminality
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm

      - name: Preserve semantic wrappers and remove interactive chrome
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('server/civic-genome-rosetta-extraction.ts')
          source = source_path.read_text()
          old_regex = '.replace(/<(script|style|noscript|svg|form|nav|header|footer)\\b[^>]*>[\\s\\S]*?<\\/\\1>/gi, " ")'
          new_regex = '.replace(/<(script|style|noscript|svg|nav|footer|button)\\b[^>]*>[\\s\\S]*?<\\/\\1>/gi, " ")'
          if source.count(old_regex) != 1:
              raise SystemExit('source wrapper replacement target missing or ambiguous')
          source_path.write_text(source.replace(old_regex, new_regex))

          test_path = Path('server/civic-genome-rosetta-extraction.test.ts')
          test = test_path.read_text()
          replacements = [
              (
                  'it("extracts visible legislative HTML while excluding executable page chrome", () => {',
                  'it("preserves bill text inside form and header wrappers while excluding executable chrome", () => {',
              ),
              (
                  '          <script>window.secret = "not law";</script>\n          <main>\n            <h1>S.B.&nbsp;No.&nbsp;268</h1>',
                  '          <script>window.secret = "not law";</script>\n          <form id="bill-form">\n            <header><h1>S.B.&nbsp;No.&nbsp;268</h1></header>\n            <button type="button">Print bill</button>\n            <main>',
              ),
              (
                  '          </main>\n          <footer>Website footer</footer>',
                  '            </main>\n          </form>\n          <footer>Website footer</footer>',
              ),
              (
                  '    expect(normalized).not.toContain("Search Bills");\n    expect(normalized).not.toContain("Website footer");',
                  '    expect(normalized).not.toContain("Search Bills");\n    expect(normalized).not.toContain("Print bill");\n    expect(normalized).not.toContain("Website footer");',
              ),
          ]
          for old, new in replacements:
              if test.count(old) != 1:
                  raise SystemExit(f'test replacement target missing or ambiguous: {old[:80]}')
              test = test.replace(old, new)
          test_path.write_text(test)
          PY

      - name: Install repository dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run expanded Rosetta boundary contracts
        run: pnpm exec vitest run server/civic-genome-rosetta-extraction.test.ts

      - name: Commit bounded patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-rosetta-html-wrapper-preservation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/civic-genome-rosetta-extraction.ts server/civic-genome-rosetta-extraction.test.ts .github/workflows/patch-rosetta-html-wrapper-preservation.yml
          git commit -m 'Preserve legislative HTML form and header content'
          git push origin HEAD:fix/rosetta-source-handoff-terminality
