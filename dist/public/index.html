  <body>
    <div id="root"></div>
    <script>
      (() => {
        const PREVIEW_TEXT = "Preview Mode";
        const SIGN_IN_TEXT = "Sign In";

        function normalizeSignInControls() {
          const candidates = document.querySelectorAll("a, button, [role='button']");
          candidates.forEach((node) => {
            const text = (node.textContent || "").trim();
            const href = node.getAttribute?.("href") || "";
            const isSignIn = text === SIGN_IN_TEXT || href.includes("app-auth") || href.includes("oauth");

            if (!isSignIn) return;

            node.textContent = PREVIEW_TEXT;
            node.setAttribute?.("aria-disabled", "true");
            node.setAttribute?.("data-preview-auth-disabled", "true");
            node.removeAttribute?.("href");
          });
        }

        document.addEventListener("click", (event) => {
          const target = event.target instanceof Element
            ? event.target.closest("a, button, [role='button']")
            : null;

          if (!target) return;

          const text = (target.textContent || "").trim();
          const href = target.getAttribute?.("href") || "";
          const isAuthControl = text === PREVIEW_TEXT || text === SIGN_IN_TEXT || href.includes("app-auth") || href.includes("oauth");

          if (!isAuthControl) return;

          event.preventDefault();
          event.stopPropagation();
          normalizeSignInControls();
          console.info("Luminari preview mode: sign-in is intentionally disabled until OAuth is verified.");
        }, true);

        const observer = new MutationObserver(normalizeSignInControls);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener("DOMContentLoaded", normalizeSignInControls);
      })();
    </script>
  </body>

</html>
