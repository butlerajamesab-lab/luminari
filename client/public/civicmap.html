<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CivicMap v2 — Lighthouse</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --accent:#38bdf8; --danger:#ef4444; --success:#22c55e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
    #map { width:100vw; height:100vh; }
    .top-bar { position:fixed; top:0; left:0; right:0; height:56px; z-index:1000; display:flex; align-items:center; gap:12px; padding:0 16px; background:rgba(15,23,42,.95); border-bottom:1px solid rgba(255,255,255,.1); }
    .logo { font-weight:700; color:var(--accent); display:flex; gap:8px; align-items:center; white-space:nowrap; }
    .search-box { position:relative; flex:1; max-width:460px; }
    .search-box input { width:100%; padding:8px 12px 8px 36px; border-radius:8px; border:1px solid rgba(255,255,255,.12); background:var(--panel); color:var(--text); }
    .search-box i { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); }
    .btn { padding:8px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.12); background:var(--panel); color:var(--text); cursor:pointer; }
    .layer-panel { position:fixed; top:72px; left:16px; z-index:1000; width:245px; padding:12px; border-radius:12px; background:rgba(15,23,42,.95); border:1px solid rgba(255,255,255,.1); }
    .layer-title { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-bottom:8px; }
    .layer-item { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px; }
    .dot { width:10px; height:10px; border-radius:50%; }
    .sidebar { position:fixed; top:56px; right:-430px; width:430px; bottom:0; z-index:1001; display:flex; flex-direction:column; background:rgba(15,23,42,.98); border-left:1px solid rgba(255,255,255,.1); transition:right .25s ease; }
    .sidebar.open { right:0; }
    .sidebar-header { padding:18px; display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid rgba(255,255,255,.1); }
    .sidebar-title { font-size:18px; font-weight:700; line-height:1.3; }
    .sidebar-meta { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; margin-top:5px; }
    .close-btn { background:none; border:0; color:var(--muted); font-size:20px; cursor:pointer; }
    .sidebar-body { overflow-y:auto; padding:18px; }
    .section { margin-bottom:20px; }
    .section-title { margin-bottom:10px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
    .info-row { display:flex; justify-content:space-between; gap:16px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:14px; }
    .info-row span:last-child { text-align:right; overflow-wrap:anywhere; }
    .info-label { color:var(--muted); flex-shrink:0; }
    .tag { display:inline-block; padding:4px 10px; border-radius:20px; margin:0 6px 6px 0; font-size:11px; font-weight:700; background:rgba(56,189,248,.18); color:var(--accent); }
    .action-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .action-btn { padding:10px; border:1px solid rgba(255,255,255,.12); border-radius:10px; color:var(--text); background:var(--panel); text-decoration:none; text-align:center; font-size:13px; }
    .action-btn.primary { background:var(--accent); color:var(--bg); font-weight:700; }
    .status-badge { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:1000; padding:10px 18px; border-radius:20px; background:rgba(15,23,42,.95); border:1px solid rgba(255,255,255,.1); font-size:13px; display:flex; gap:8px; align-items:center; }
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--success); }
    @media (max-width:768px) { .sidebar{width:100%;right:-100%;} .layer-panel{top:auto;left:10px;bottom:78px;} .btn span{display:none;} }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="logo"><i class="fas fa-compass"></i> CivicMap v2 — Viewport</div>
    <div class="search-box"><i class="fas fa-search"></i><input id="searchInput" type="text" placeholder="Filter visible points..." /></div>
    <button class="btn" onclick="reloadViewportPoints(true)"><i class="fas fa-sync"></i> <span>Reload</span></button>
  </div>
  <div class="layer-panel" id="layerPanel"></div>
  <div id="map"></div>
  <div class="sidebar" id="sidebar"><div class="sidebar-header"><div><div class="sidebar-title" id="sbTitle">Select a point</div><div class="sidebar-meta" id="sbMeta">Viewport-loaded CivicMap</div></div><button class="close-btn" onclick="closeSidebar()"><i class="fas fa-times"></i></button></div><div class="sidebar-body" id="sbBody"><p style="color:var(--muted);text-align:center;padding:30px 10px;">Click a visible point to load details on demand.</p></div></div>
  <div class="status-badge"><span class="status-dot"></span><span id="statusText">Initializing CivicMap...</span></div>
  <script>
    const US_CENTER = [39.8283, -98.5795];
    const VIEWPORT_LIMIT = 1200;
    const CATEGORY_COLORS = { verified_signal:'#f43f5e', housing:'#f97316', food:'#84cc16', legal:'#06b6d4', health:'#ec4899', employment:'#eab308', government:'#10b981', civil:'#8b5cf6', enforcement:'#a855f7', other:'#64748b' };
    const CATEGORY_LABELS = { verified_signal:'verified legal signals' };
    const CATEGORY_MAP = { housing:['housing','shelter','tenant'], food:['food','nutrition'], legal:['legal','court','immigration_legal','record_clearing'], health:['health','clinic','hospital','mental','domestic_violence','hotline','crisis'], employment:['employment','unemployment','wage','worker','business'], government:['government','benefit','federal','program','tribal','utility','veteran','disability'], civil:['civil','advocacy','consumer','voter','rights','watchdog','transparency'], enforcement:['enforcement','oversight','fraud','agency_authority'], other:['resource','other'] };
    let map;
    let categoryLayers = {};
    let loadedPoints = [];
    let activeCategories = new Set(Object.keys(CATEGORY_COLORS));
    let debounceTimer = null;
    let requestSeq = 0;
    let boundsAbortController = null;
    function updateStatus(message) { document.getElementById('statusText').textContent = message; }
    function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function escapeAttribute(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }
    function toArray(value) { return Array.isArray(value) ? value : (value ? [value] : []); }
    function classifyNodeType(resourceType) { const type = String(resourceType || '').toLowerCase(); for (const [category, terms] of Object.entries(CATEGORY_MAP)) if (terms.some(term => type.includes(term))) return category; return 'other'; }
    function initLayerPanel() { document.getElementById('layerPanel').innerHTML = '<div class="layer-title">Visible layers</div>' + Object.entries(CATEGORY_COLORS).map(([cat, color]) => `<label class="layer-item"><input type="checkbox" checked onchange="toggleCategory('${cat}')"><span class="dot" style="background:${color}"></span><span>${CATEGORY_LABELS[cat] || cat.replace(/_/g, ' ')}</span></label>`).join(''); }
    function init() { initLayerPanel(); map = L.map('map').setView(US_CENTER, 4); L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution:'&copy; OpenStreetMap contributors &copy; CARTO', subdomains:'abcd', maxZoom:20 }).addTo(map); for (const category of Object.keys(CATEGORY_COLORS)) categoryLayers[category] = L.layerGroup().addTo(map); map.on('moveend zoomend', scheduleViewportReload); setupSearch(); reloadViewportPoints(true); }
    function scheduleViewportReload() { clearTimeout(debounceTimer); debounceTimer = setTimeout(() => reloadViewportPoints(false), 300); }
    function groupVerifiedSignals(rows) {
      const groups = new Map();
      for (const row of rows || []) {
        const latitude = Number(row.latitude);
        const longitude = Number(row.longitude);
        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) continue;
        const key = `${row.state_code || row.jurisdiction || 'unknown'}:${latitude}:${longitude}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push({ ...row, latitude, longitude });
      }
      return Array.from(groups.entries()).map(([key, signals]) => {
        const first = signals[0];
        return {
          id: `verified_signal_cluster_${key.replace(/[^a-zA-Z0-9_-]/g, '_')}`,
          kind: 'signal_cluster',
          name: `${first.jurisdiction || first.state_code || 'Jurisdiction'} verified legal signals`,
          resource_type: 'verified legal signals',
          category: 'verified_signal',
          latitude: first.latitude,
          longitude: first.longitude,
          state: first.state_code,
          jurisdiction: first.jurisdiction,
          coordinate_precision: first.coordinate_precision,
          coordinate_source: first.coordinate_source,
          signals,
          signal_count: signals.length,
        };
      });
    }
    async function reloadViewportPoints(force) {
      if (!map) return;
      const seq = ++requestSeq;
      const b = map.getBounds();
      if (boundsAbortController) boundsAbortController.abort();
      boundsAbortController = new AbortController();
      updateStatus('Loading visible CivicMap resources and verified signals...');
      const url = `/api/civic-map/bounds?north=${encodeURIComponent(b.getNorth())}&south=${encodeURIComponent(b.getSouth())}&east=${encodeURIComponent(b.getEast())}&west=${encodeURIComponent(b.getWest())}&limit=${VIEWPORT_LIMIT}`;
      try {
        const response = await fetch(url, { signal: boundsAbortController.signal });
        const payload = await response.json();
        if (seq !== requestSeq) return;
        if (!response.ok || !payload.ok) {
          console.error('CivicMap bounds load failed', payload);
          updateStatus(`CivicMap load failed — ${payload.error || 'api_error'}`);
          return;
        }
        const resources = (payload.nodes || []).map(row => ({
          ...row,
          id: row.node_id,
          kind: 'resource',
          name: row.name || 'Unnamed civic resource',
          resource_type: row.node_type || 'resource',
          category: classifyNodeType(row.node_type),
          latitude: Number(row.latitude),
          longitude: Number(row.longitude),
        })).filter(point => Number.isFinite(point.latitude) && Number.isFinite(point.longitude));
        const signalClusters = groupVerifiedSignals(payload.signals || []);
        loadedPoints = [...signalClusters, ...resources];
        renderLoadedPoints();
        updateStatus(`Loaded ${resources.length} resources + ${payload.signal_count || 0} verified signals in ${signalClusters.length} jurisdiction marker${signalClusters.length === 1 ? '' : 's'}${resources.length >= VIEWPORT_LIMIT ? ' — zoom in for more precision' : ''}`);
      } catch (error) {
        if (error && error.name === 'AbortError') return;
        console.error('CivicMap bounds request failed', error);
        updateStatus('CivicMap request failed — check connection');
      }
    }
    function renderLoadedPoints() {
      for (const layer of Object.values(categoryLayers)) layer.clearLayers();
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = loadedPoints.filter(point => {
        if (!activeCategories.has(point.category)) return false;
        if (!search) return true;
        const baseMatch = [point.name, point.resource_type, point.city, point.county, point.state, point.source_key, point.jurisdiction].some(v => String(v || '').toLowerCase().includes(search));
        const signalMatch = point.kind === 'signal_cluster' && point.signals.some(signal => [signal.name, signal.signal_family, signal.signal_type, signal.court, signal.docket_number].some(v => String(v || '').toLowerCase().includes(search)));
        return baseMatch || signalMatch;
      });
      for (const point of filtered) {
        const color = CATEGORY_COLORS[point.category] || CATEGORY_COLORS.other;
        const isSignal = point.kind === 'signal_cluster';
        const size = isSignal ? 32 : (point.category === 'enforcement' ? 14 : 12);
        const markerBody = isSignal
          ? `<div style="display:flex;align-items:center;justify-content:center;background:${color};color:#fff;width:${size}px;height:${size}px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);font-size:10px;font-weight:800;">${escapeHtml(point.signal_count)}</div>`
          : `<div style="background:${color};width:${size}px;height:${size}px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.35);"></div>`;
        const icon = L.divIcon({ className:'custom-marker', html:markerBody, iconSize:[size,size], iconAnchor:[size/2,size/2] });
        const marker = L.marker([point.latitude, point.longitude], { icon });
        marker.on('click', () => loadPointDetail(point));
        categoryLayers[point.category].addLayer(marker);
      }
    }
    async function loadPointDetail(point) {
      document.getElementById('sidebar').classList.add('open');
      if (point.kind === 'signal_cluster') {
        renderSignalCluster(point);
        return;
      }
      document.getElementById('sbTitle').textContent = point.name;
      document.getElementById('sbMeta').textContent = `${point.resource_type.replace(/_/g, ' ').toUpperCase()} • loading detail`;
      document.getElementById('sbBody').innerHTML = '<p style="color:var(--muted);">Loading detail...</p>';
      const response = await fetch(`/api/civic-map/detail/${encodeURIComponent(point.id)}`);
      const payload = await response.json();
      if (!response.ok || !payload.ok) {
        console.error('CivicMap detail load failed', payload);
        renderDetail(point);
        return;
      }
      renderDetail(payload.node || point);
    }
    function countBy(rows, key) {
      return rows.reduce((counts, row) => {
        const value = row[key] || 'unknown';
        counts[value] = (counts[value] || 0) + 1;
        return counts;
      }, {});
    }
    function safeHttpUrl(value) {
      if (!value) return '';
      try {
        const parsed = new URL(String(value), window.location.origin);
        return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? parsed.href : '';
      } catch {
        return '';
      }
    }
    function renderSignalCluster(point) {
      const signals = point.signals || [];
      const familyCounts = countBy(signals, 'signal_family');
      const typeCounts = countBy(signals, 'signal_type');
      document.getElementById('sbTitle').textContent = point.name;
      document.getElementById('sbMeta').textContent = `${signals.length} VERIFIED DETERMINISTIC SIGNALS • JURISDICTION LEVEL`;
      const familyTags = Object.entries(familyCounts).map(([name, count]) => `<span class="tag">${escapeHtml(name)} · ${count}</span>`).join('');
      const typeRows = Object.entries(typeCounts).sort((a, b) => b[1] - a[1]).map(([name, count]) => row(name.replace(/_/g, ' '), count)).join('');
      const cards = signals.slice(0, 25).map(signal => {
        const sourceUrl = safeHttpUrl(signal.source_url);
        const detected = signal.detected_at ? new Date(signal.detected_at).toLocaleDateString() : '';
        return `<div style="padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);"><div style="font-weight:700;font-size:13px;">${escapeHtml(signal.name || signal.signal_type)}</div><div style="color:var(--muted);font-size:11px;margin:4px 0;">${escapeHtml(signal.signal_family)} • ${escapeHtml(signal.signal_type)}${detected ? ` • ${escapeHtml(detected)}` : ''}</div>${signal.description ? `<div style="font-size:12px;line-height:1.45;">${escapeHtml(signal.description)}</div>` : ''}<div style="color:var(--muted);font-size:11px;margin-top:5px;">rule ${escapeHtml(signal.rule_id || '—')} ${escapeHtml(signal.rule_version || '')} • ${escapeHtml(signal.verification_status)}</div>${sourceUrl ? `<a class="action-btn" style="display:inline-block;margin-top:8px;padding:6px 9px;" href="${escapeAttribute(sourceUrl)}" target="_blank" rel="noopener"><i class="fas fa-external-link-alt"></i> Source</a>` : ''}</div>`;
      }).join('');
      document.getElementById('sbBody').innerHTML = `<div class="section">${familyTags}</div><div class="section"><div class="section-title">Signal types</div>${typeRows}</div><div class="section"><div class="section-title">Coordinate policy</div><p style="font-size:13px;line-height:1.5;">This marker uses the ${escapeHtml(point.jurisdiction || point.state || 'state')} jurisdiction centroid. It is a display anchor, not an incident or source location.</p>${row('Precision', point.coordinate_precision)}${row('Coordinate source', point.coordinate_source)}${row('Signal source', 'v_lighthouse_verified_legal_signals_v1')}</div><div class="section"><div class="section-title">Most recent verified records</div>${cards}${signals.length > 25 ? `<p style="color:var(--muted);font-size:12px;margin-top:12px;">Showing 25 of ${signals.length} records in this viewport.</p>` : ''}</div>`;
    }
    function renderDetail(item) { const title = item.name || item.organization_name || item.agency_name || item.title || 'Unnamed resource'; const metaParts = [item.resource_type || item.node_type, item.city, item.state].filter(Boolean); document.getElementById('sbTitle').textContent = title; document.getElementById('sbMeta').textContent = metaParts.join(' • ') || 'CivicMap detail'; const website = item.website_url || item.website || ''; const categories = toArray(item.service_categories); const languages = toArray(item.languages); document.getElementById('sbBody').innerHTML = `<div class="section"><span class="tag">${escapeHtml(item.resource_type || item.node_type || 'resource')}</span>${item.geocode_precision ? `<span class="tag">${escapeHtml(item.geocode_precision)}</span>` : ''}</div><div class="section"><div class="section-title">Details</div>${row('Organization', item.organization_name || item.agency_name || title)}${row('Description', item.description)}${row('Address', [item.address_line1, item.address_line2, item.city, item.state, item.postal_code].filter(Boolean).join(', '))}${row('Phone', item.phone)}${row('Email', item.email)}${row('Source', item.source_key)}${row('Updated', item.updated_at)}</div>${categories.length ? `<div class="section"><div class="section-title">Service categories</div>${categories.map(c => `<span class="tag">${escapeHtml(c)}</span>`).join('')}</div>` : ''}${languages.length ? `<div class="section"><div class="section-title">Languages</div>${languages.map(l => `<span class="tag">${escapeHtml(l)}</span>`).join('')}</div>` : ''}${item.eligibility_summary ? `<div class="section"><div class="section-title">Eligibility</div><p>${escapeHtml(item.eligibility_summary)}</p></div>` : ''}<div class="section"><div class="section-title">Actions</div><div class="action-grid">${item.phone ? `<a class="action-btn primary" href="tel:${escapeAttribute(item.phone)}"><i class="fas fa-phone"></i> Call</a>` : `<button class="action-btn">No phone</button>`}${website ? `<a class="action-btn" href="${escapeAttribute(website)}" target="_blank" rel="noopener"><i class="fas fa-globe"></i> Website</a>` : `<button class="action-btn">No website</button>`}</div></div>`; }
    function row(label, value) { if (value === undefined || value === null || value === '') return ''; return `<div class="info-row"><span class="info-label">${escapeHtml(label)}</span><span>${escapeHtml(value)}</span></div>`; }
    function toggleCategory(category) { if (activeCategories.has(category)) { activeCategories.delete(category); map.removeLayer(categoryLayers[category]); } else { activeCategories.add(category); categoryLayers[category].addTo(map); } renderLoadedPoints(); }
    function setupSearch() { document.getElementById('searchInput').addEventListener('input', renderLoadedPoints); }
    function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
